# UNVERIFIED: validate via spectramr audit on cluster
# Minimal settings fixture for the pinn family.
# Covers strategy keys: pinn
# Based on experiments/active/experiment_12_pinn_reconstruction.yaml
# (trimmed to minimal fields; includes mandatory losses.pinn block required
# by ConcretePINNSensitivityStrategy and check_paradigm_required_fields).
config_version: '1.0'

run:
  seed: 42
metadata:
  name: minimal_pinn_fixture
  description: Minimal CPU smoke fixture for ConcretePINNSensitivityStrategy
  tags:
    - fixture
    - minimal
    - pinn

training:
  strategy_class: spectramr.infrastructure.training.strategies.pinn_strategy.ConcretePINNSensitivityStrategy
  epochs: 1
  max_iterations: 2
  device: cpu
  task: reconstruction
  output_dir: /tmp/spectramr_test/pinn
  enable_mixed_precision: false
  physics_informed: true
  diffusion:
    timesteps: 10
    noise_schedule: cosine
    sampler: ddpm
  latent:
    latent_dim: 4
    beta_kl: 0.0

data:
  dataset_type: synthetic
  patch_size: [16, 16, 1]
  batch_size: 2
  num_workers: 0
  normalize_kspace: false
  normalize_images: true
  validation_split: 0.1
  target_channels: 1
  samples_per_volume: 2
  datasets:
    - name: synthetic
      path: /tmp/synthetic_placeholder
  caching:
    strategy: none

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  model_kwargs:
    base_channels: 8
    channel_multipliers: [1, 2]
    num_res_blocks: 1
    dropout: 0.0

optimization:
  learning_rate: 1.0e-4
  optimizer_type: adam
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  use_amp: false
  enable_gradient_clipping: false

acceleration:
  base_acceleration: 4.0

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
  # pinn block required by ConcretePINNSensitivityStrategy and
  # check_paradigm_required_fields (losses.pinn must be non-None)
  pinn:
    enable_pde: true
    lambda_pde: 0.1
    enable_unit_norm_coil: false
    lambda_unit_norm_coil: 10.0
    enable_magnitude_tv: false
    lambda_magnitude_tv: 0.001
    enable_pinn_dc: false
    lambda_pinn_dc: 1.0

physics:
  kspace:
    enforce_hermitian_symmetry: false
    enable_kspace_recon: false
  data_consistency:
    enabled: false

logging:
  log_interval: 1
  log_to_file: false
  log_to_console: false
  enable_experiment_tracking: false
  level: warning

checkpoint:
  enabled: false

validation:
  enabled: false

metrics:
  compute_psnr: false
  compute_ssim: false
  compute_mse: true
