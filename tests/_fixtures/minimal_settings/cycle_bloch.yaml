# UNVERIFIED: validate via spectramr audit on cluster
# Minimal settings fixture for the cycle_bloch family.
# Covers strategy keys: cycle_bloch, symplectic_bloch
# Based on experiments/active/experiment_42_bloch_cycles.yaml
# (trimmed to minimal fields; includes model.discriminator_component block
# required by CycleBlochStrategy and check_cycle_bloch_requires_discriminator).
config_version: '1.0'

run:
  seed: 42
metadata:
  name: minimal_cycle_bloch_fixture
  description: Minimal CPU smoke fixture for CycleBlochStrategy
  tags:
    - fixture
    - minimal
    - cycle_bloch

training:
  strategy_class: spectramr.infrastructure.training.strategies.cycle_bloch_strategy.CycleBlochStrategy
  training_mode: cycle_bloch
  epochs: 1
  max_iterations: 2
  device: cpu
  task: reconstruction
  output_dir: /tmp/spectramr_test/cycle_bloch
  enable_mixed_precision: false
  physics_informed: false

data:
  dataset_type: synthetic
  patch_size: [16, 16, 1]
  batch_size: 2
  num_workers: 0
  normalize_kspace: false
  normalize_images: true
  validation_split: 0.1
  target_channels: 1
  samples_per_volume: 2
  datasets:
    - name: synthetic
      path: /tmp/synthetic_placeholder
  caching:
    strategy: none

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  model_kwargs:
    base_channels: 8
    channel_multipliers: [1, 2]
    num_res_blocks: 1
    dropout: 0.0
  # discriminator_component required by CycleBlochStrategy (raises ValueError
  # at first training step when absent — check_cycle_bloch_requires_discriminator)
  discriminator_component:
    name: patch_gan_discriminator
    kwargs:
      in_channels: 1
      n_layers: 2
      ndf: 32

optimization:
  learning_rate: 1.0e-4
  optimizer_type: adam
  weight_decay: 0.0
  beta1: 0.5
  beta2: 0.999
  use_amp: false
  enable_gradient_clipping: false

acceleration:
  base_acceleration: 4.0

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []

physics:
  kspace:
    enforce_hermitian_symmetry: false
    enable_kspace_recon: false
  data_consistency:
    enabled: false

logging:
  log_interval: 1
  log_to_file: false
  log_to_console: false
  enable_experiment_tracking: false
  level: warning

checkpoint:
  enabled: false

validation:
  enabled: false

metrics:
  compute_psnr: false
  compute_ssim: false
  compute_mse: true
