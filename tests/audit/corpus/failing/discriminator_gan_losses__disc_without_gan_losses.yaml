# FAILING YAML — trips: discriminator_gan_losses (ConfigHealthChecker)
# Violation: model.discriminator_component is present but losses.gan is absent
#   (enable_adversarial not set).  check_discriminator_requires_gan_losses fires.
# check_name: discriminator_gan_losses
# severity: error
#
# How the check fires (config_health_checker.py::check_discriminator_requires_gan_losses):
#   model.discriminator_component is not None      → has_discriminator = True
#   losses.gan is None                             → enable_adv = False → error
#   This catches the bug: _build_composite_gan doesn't build the discriminator
#   optimizer → Trainer.execute_step crashes with "step_configs[1] optimizer=None"

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — discriminator_gan_losses (disc_component declared, losses.gan absent)

training:
  strategy_class: spectramr.infrastructure.training.strategies.gan.GANTrainingStrategy
  training_mode: gan
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_disc_gan_losses

data:
  dataset_type: synthetic
  coil_processing_mode: rss
  patch_size: [32, 32, 1]
  batch_size: 2
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  # <<< discriminator declared. The spelling matters: `ModelComponentSchema` has
  # exactly the fields {name, kwargs} with extra="ignore", so the earlier
  # `discriminator_type: patch_gan_2d` / `in_channels: 1` were BOTH discarded and
  # this component resolved to `name='' kwargs={}` -- an empty block that trips
  # the check for the wrong reason, while advertising a discriminator the run
  # never saw (#1933). `patch_gan_2d` is not in MODEL_REGISTRY either; `patch_gan`
  # is (init_registry.py alias). Do not "simplify" this back, and do not delete
  # the block to fix it: `discriminator_component:` with no children parses as
  # None, `has_discriminator` goes False, and the fixture silently stops testing
  # anything.
  discriminator_component:
    name: patch_gan
    kwargs:
      in_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_disc_gan_losses/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
  # losses.gan is intentionally ABSENT — this is the violation
  # (losses.gan.enable_adversarial must be true when discriminator_component is set)
