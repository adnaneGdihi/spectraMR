# FAILING YAML — trips: discriminator_gan_losses (ConfigHealthChecker)
# Violation: losses.gan.enable_adversarial is true, but the discriminator is declared under
#   model.model_kwargs, which the model builder never reads, so no critic is built.
# check_name: discriminator_gan_losses
# severity: error
#
# The shape three disentangled M4Raw arms had until 2026-10-10: on the disentangled
# strategy the adversarial step was skipped without a word (sabine job 17885803); under
# training_mode: gan the optimizer builder raises at build time instead.

config_version: '1.0'

run:
  seed: 42
metadata:
  name: Failing — discriminator_gan_losses (adversarial on, discriminator under model_kwargs)

training:
  strategy_class: spectramr.infrastructure.training.strategies.gan.GANTrainingStrategy
  training_mode: gan
  max_iterations: 10
  device: cuda
  task: reconstruction
  output_dir: experiments/results/corpus_failing_adv_without_disc

data:
  dataset_type: synthetic
  coil_processing_mode: rss
  patch_size: [32, 32, 1]
  batch_size: 2
  num_workers: 0
  datasets:
    - name: dummy
      path: databases/m4raw/data/multicoil_train

model:
  model_type: standard_unet
  in_channels: 1
  out_channels: 1
  model_kwargs:
    # <<< one level too deep: model.discriminator_component is the only key that builds one
    discriminator_component:
      name: patch_gan
      kwargs:
        in_channels: 1

optimization:
  learning_rate: 0.0001
  optimizer_type: adam

logging:
  log_interval: 5
  level: warning
  log_dir: experiments/results/corpus_failing_adv_without_disc/logs

losses:
  output_domain: image
  image_losses:
    - name: mse
      weight: 1.0
      enabled: true
  kspace_losses: []
  complex_losses: []
  gan:
    enable_adversarial: true
    lambda_adv: 1.0
    gan_loss_type: hinge
