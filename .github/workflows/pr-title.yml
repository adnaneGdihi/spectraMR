name: PR title

# Plain `pull_request`: the job only reads the PR title from the event payload and
# its own pass/fail is the check, so it needs no base-repo write token.

on:
  # No `branches:` filter -- it matches the PR's BASE branch, and PRs here target both
  # `dev` and `main`; pinning it to either base silently skips the other.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits prefix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches the prefix set documented in CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            ci
            perf
            build
          # Optional scope; if present must be lowercase kebab-case.
          requireScope: false
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            The subject of the PR title must start with a lowercase letter.
            Examples:
              feat(losses): add Wasserstein-GP loss
              fix(physics): correct fft2c normalisation for AMP path
              docs(api): regenerate autoapi after registry rename
          validateSingleCommit: false
