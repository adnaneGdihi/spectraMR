name: Release

# Publishing is irreversible: PyPI never re-issues a filename it has seen, so a
# wheel that is wrong reaching the index costs a version number rather than an
# amend. `workflow_dispatch` therefore builds and verifies the exact artefacts a
# tag would publish, and publishes nothing -- rehearse there, then tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# NOT declared at workflow level. `id-token: write` mints an OIDC token that is
# a PyPI upload credential, and a workflow-level grant hands it to every job --
# including `build`, which executes the build backend and whatever the tree's
# dependencies bring with it. It is granted to the one job that publishes.
permissions:
  contents: read

jobs:
  build:
    # Runs on the maintainer's self-hosted runner (registered name `thor`).
    #
    # `runs-on` matches LABELS, never the runner NAME. thor was registered with
    # its custom labels skipped, so `[self-hosted, Linux, ARM64]` is the only
    # selector that reaches it -- `[self-hosted, thor]` would queue forever.
    #
    # thor listens via a foreground `./run.sh`, not a service, so it is offline
    # unless the maintainer starts it. A job targeted here QUEUES until then.
    # That physical presence -- not `environment:`, which currently has empty
    # protection_rules -- is what makes the release maintainer-driven today.
    #
    # spectraMR is a PUBLIC repo, so NO `pull_request`-family trigger may ever
    # reach this runner: a fork PR would execute untrusted code on the
    # maintainer's machine. This workflow fires only on `push: tags` and
    # `workflow_dispatch`; keep it that way, and keep pr-required / pr-advisory
    # / codeql on ubuntu-latest.
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # build_dist.py reads src/spectramr/__init__.py as *text*, so verification
      # never imports the package and needs none of its 5.1 GB of dependencies.
      - run: pip install build twine

      - name: Build and verify the distribution
        # Interpolation goes through env, not into the command line: a ref name
        # reaches this runner from the event payload, and pasting it into a
        # shell string is the standard script-injection seam.
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # The tag becomes a fifth version source. v0.1.1 pushed at a tree
            # still declaring 0.1.0 would otherwise publish spectramr-0.1.0 under
            # a v0.1.1 release and burn that filename permanently.
            python scripts/release/build_dist.py --expect-version "$REF_NAME"
          else
            # A dispatch runs from a branch, whose name states no version.
            python scripts/release/build_dist.py
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    # A dry run must not be able to reach the index by any path.
    if: github.event_name == 'push'
    # Deliberately NOT on thor, and this is a physical blocker rather than a
    # preference. `pypa/gh-action-pypi-publish@release/v1` is a composite that
    # GENERATES a Docker container action at run time and runs
    # `docker://ghcr.io/pypa/gh-action-pypi-publish:release-v1`. Every published
    # tag of that image is a single-arch linux/amd64 manifest -- checked on
    # 2026-09-04 against the GHCR registry API for release-v1, v1.14, v1.14.1 and
    # v1.14.2; not one carries an arm64 variant. On ARM64 the pull fails outright
    # (or silently runs under qemu if binfmt happens to be registered, which is
    # not a configuration to publish a release from). Move this job the moment
    # upstream ships a multi-arch image.
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC Trusted Publishing -- scoped to this job alone
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        # OIDC Trusted Publishing -- no token needed.
        # Configure on PyPI first; see manual step §19.4.

  github-release:
    needs: pypi
    if: github.event_name == 'push'
    # On thor -- every action here is JavaScript (checkout, download-artifact,
    # softprops/action-gh-release), so ARM64 runs them natively. See the build
    # job for why the label triple, and not the name `thor`, is the selector.
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
