name: Test (release)

# Full test suite + mutation testing, on a release tag. Publishes nothing and
# gates nothing: `release.yml` is what reaches PyPI, and it does not wait on this.
#
# WHAT THIS LANE HAD NEVER DONE, until 2026-09-04. Run 33881085296 is the record:
# 40m42s, conclusion=failure, and `7 skipped, 3 warnings, 3 errors in 2245.79s`.
# Three tests loaded a `scripts/` file by path that the public allowlist does not
# ship, so pytest reported `Interrupted: 3 errors during collection` -- and pytest
# aborts the whole session on a collection error. **Zero tests ever executed.**
# `make` stopped on that line, so mutation testing never ran either, and the
# coverage upload was skipped, which is why the codecov badge never filled.
# Fixed in `tests/utils/repo_scripts.py`; the two structural changes below make
# the next occurrence cheaper to see.
#
# 1. The suite and the mutation run are now separate JOBS rather than two lines of
#    one `make` target. They are independent, so they run concurrently -- and,
#    more importantly, a red suite no longer silently cancels mutation testing.
# 2. Coverage uploads `if: always()`. A lane whose suite is expected to be red
#    (dev is standing-red) must still report, or its one durable artefact is lost
#    exactly when it is most useful.
#
# Deliberately NOT parallelized with pytest-xdist: measured on this suite, the
# failure SET diverges by worker count -- 16 failures serial, 43 at `-n 2`, 31 at
# `-n 4`, 27 at `-n 8` -- because the metric registry carries cross-file state.
# A hosted runner is 4 cores, so `-n auto` there would invent ~15 phantom
# failures. See the comment on `test-release-suite` in the Makefile, and the
# isolation defect filed against the metrics registry.
#
# GPU-marked tests are included in this lane.
# TODO: replace `ubuntu-latest` with a CUDA-capable runner label once one
#       is configured in the repository's Actions runner pool — GPU-marked
#       tests will be silently skipped on a CPU-only runner (they carry
#       the `gpu` marker which conftest.py skips without CUDA).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# No `release: types: [published]`. It could not fire on the path it was written
# for: the GitHub Release here is published BY a workflow using GITHUB_TOKEN, and
# GitHub suppresses workflow runs triggered that way to prevent recursion --
# confirmed on the v0.1.0 release, where no second run appeared. On the remaining
# path (a maintainer publishing a release by hand) it was actively harmful: the
# tag push has already started this lane, `cancel-in-progress: false` queues
# rather than replaces, and the result is two full-length runs of the same commit.

permissions:
  contents: read

concurrency:
  group: test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    name: full test suite
    # On the maintainer's self-hosted runner (registered name `thor`). `runs-on`
    # matches LABELS, never the NAME -- thor's custom labels were skipped at
    # registration, so this label triple is the only selector that reaches it.
    #
    # Reachable here only because this workflow has no `pull_request`-family
    # trigger. spectraMR is public; a fork PR routed to a self-hosted runner
    # executes untrusted code on the maintainer's machine. Do not add one.
    #
    # Installable on ARM64 only since gudhi was marked off aarch64 in
    # pyproject.toml's [topology] extra -- before that, `pip install -e ".[dev]"`
    # in setup-env failed during resolution and this job could never start. The
    # two gudhi-dependent tests then skip themselves via `pytest.importorskip`
    # (measured: 51 passed, 2 skipped, exit 0), so no marker or --deselect is
    # needed to keep the lane green without topology.
    #
    # `# TODO: CUDA runner` retired only in the sense that the runner is now
    # explicit: whether thor exposes a GPU is NOT verified from here. Without
    # CUDA the `gpu`-marked tests still skip silently (conftest.py), so a green
    # run is not evidence they executed.
    runs-on: [self-hosted, Linux, ARM64]
    # Left at the original budget on purpose. No run of this lane has ever
    # executed a test, so there is no measurement to size it from; resize once a
    # completed run reports a real duration.
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-env
        with:
          extras: dev

      - name: Install atheris (best-effort)
        # Fuzz targets live in tests/ and skip themselves when atheris is absent;
        # it is not in [dev] because it needs a compiler toolchain.
        run: pip install atheris || true

      - name: Run the full suite
        env:
          SPECTRAMR_SUPPRESS_CLINICAL_WARNING: "1"
        run: make test-release-suite

      - name: Upload coverage
        # `always()`: the suite is expected to be red while dev is standing-red,
        # and the coverage XML is still valid and still the point.
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          file: ./tests_experiments/coverage_release.xml
          flags: release
          fail_ci_if_error: false

  mutation:
    name: mutation testing
    # Same runner as `suite` -- see that job for the label/name distinction and
    # the no-fork-PR constraint. thor is a single `./run.sh` listener, so it runs
    # ONE job at a time: a `v*` tag push enqueues four jobs onto it (this lane's
    # `suite` and `mutation`, 480 min budget each, plus release.yml's `build` and
    # `github-release`) and they drain serially, not in parallel. Only `pypi`
    # runs elsewhere. Budget the tag accordingly.
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-env
        with:
          extras: dev

      - name: Install mutmut (best-effort)
        # Not in [dev]; `make test-mutation` prints a WARNING and exits 0 without
        # it, so a failure here must not fail the job.
        run: pip install mutmut || true

      - name: Run mutation testing
        env:
          SPECTRAMR_SUPPRESS_CLINICAL_WARNING: "1"
        run: make test-mutation
