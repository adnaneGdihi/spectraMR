name: Dev publish

# `dev` ships builds. Dispatching this lane against `dev` publishes a pre-release
# to PyPI, which `pip install --pre spectramr` installs and a plain
# `pip install spectramr` never prefers, because PEP 440 sorts a `.devN` build
# BEFORE the release whose number it carries. The newest one is what `nightly`
# names.
#
# DISPATCH-ONLY, and neither half of that is a shortcut.
#
# `push: branches: [dev]` is what this lane wanted and cannot have:
# `test_workflow_triggers.py::test_push_triggers_are_tag_only` allows a `push:`
# trigger only when it is scoped to tags, with no allowlist entry able to license
# a branch push -- "a branch push is autonomous CI". A `schedule:` cron is the
# other autonomous option and is worse here: crons register from the DEFAULT
# branch, so one would fire zero times until a release export carries this file
# onto public `main` (the shape `nightly.yml` had for its entire life). Dispatch
# is therefore the only trigger that both passes the gate and actually runs, and
# it puts a publish behind a person -- the same posture as the release lane,
# where a human pushes the tag.
#
# This file ships to BOTH repositories, because the export allowlist selects
# `.github/` wholesale and the overlay is replace-only: it cannot add a path the
# allowlist is not already shipping, so a public-repo-only workflow file does not
# exist as an option. The private research repository this tree is exported from
# also carries a `dev`, and it is that repository's main working branch -- so
# without the repository guard on every job below, a dispatch there would attempt
# a PyPI publish. The guard is the mechanism; do not remove it.
on:
  workflow_dispatch:

# Not at workflow level -- see release.yml. `id-token: write` IS the upload
# credential, and `build` executes the build backend.
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'adnaneGdihi/spectraMR'
    # NOT on thor. `dev` moves whenever an export snapshot lands, so this lane
    # must run without the maintainer being at the machine; thor listens via a
    # foreground `./run.sh` and a job targeted there queues until it is started.
    # ubuntu-latest also keeps the amd64-only pypi-publish image reachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install build twine

      - name: Stamp the build counter into every file that states the version
        # PyPI never re-issues a filename, so two runs may not produce the same
        # wheel name. `github.run_number` is monotonic per workflow and per repo,
        # which is the only counter here that cannot repeat. It restarts if this
        # FILE IS RENAMED -- renaming it therefore burns the filenames already
        # published, and needs a `build` bump on dev in the same change.
        #
        # The X.Y.B half is read, never hardcoded: hardcoding it is how a lane
        # keeps publishing 0.1.3.devN after dev has opened 0.1.4.
        run: |
          set -euo pipefail
          xyb=$(python - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "scripts/release")
          from build_dist import declared_version

          v = declared_version(pathlib.Path("src/spectramr/__init__.py").read_text())
          if v is None:
              raise SystemExit("__version__ is unreadable -- refusing to guess a version")
          if ".dev" not in v:
              raise SystemExit(
                  f"dev carries {v!r}, a release. A 0.1.3.devN wheel sorts BEFORE 0.1.3 and "
                  "would be a pre-release of something already shipped. Run "
                  "'bump_version.py nightly --apply' on dev to open the next series."
              )
          print(v.split(".dev")[0])
          PY
          )
          python scripts/release/bump_version.py set "${xyb}.dev${GITHUB_RUN_NUMBER}" --apply

      - name: Build and verify the distribution
        # No --expect-version: this lane cuts no tag, so there is no fifth source.
        # The CHANGELOG is judged by shape here -- a dev build is satisfied by an
        # open [Unreleased] section, because bump_version writes it no heading.
        run: python scripts/release/build_dist.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-dev
          path: dist/

  pypi:
    needs: build
    # `dev` ships builds -- so the REF, not the event, is what licenses an upload.
    # `workflow_dispatch` runs from any branch, and without this a dispatch from a
    # feature branch would upload `X.Y.B.dev<n>` built from a tree that is not
    # `dev` and burn that filename permanently (PyPI never re-issues one). A
    # dispatch from any other ref therefore builds and verifies exactly what `dev`
    # would publish, and uploads nothing -- which is also how you rehearse a
    # change to this file.
    if: github.ref == 'refs/heads/dev' && github.repository == 'adnaneGdihi/spectraMR'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC Trusted Publishing -- scoped to this job alone
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-dev
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # A re-run of a run whose upload half-failed reuses its run_number and
          # so its filename. Without this the re-run dies on PyPI's refusal and
          # the fix becomes a version bump rather than a button.
          skip-existing: true
        # Trusted Publishing is pinned to a WORKFLOW FILENAME, so release.yml's
        # publisher entry does not cover this file. A second entry naming
        # `dev-publish.yml` is required, and is a person's action on pypi.org.
