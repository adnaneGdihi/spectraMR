name: Zenodo deposition

# `workflow_dispatch` ONLY, and that is the ordering constraint rather than
# caution. Publication order here is public tree -> Zenodo -> tag: the tag is what
# triggers the PyPI publish, and the DOI has to exist before the release quotes
# it. A workflow keyed on `release: published` or on the tag push cannot run at
# that point in the sequence -- by the time either event fires, the tag it was
# meant to precede already exists. So this is a button, pressed between the
# publish and the tag.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the deposition (IRREVERSIBLE: mints a permanent DOI). Leave off to create a reviewable draft."
        type: boolean
        default: false
      sandbox:
        description: "Deposit to sandbox.zenodo.org instead of the live archive."
        type: boolean
        default: false
      carry_forward:
        description: "Inherited files to keep on the new version, space-separated. Everything else the parent record holds is dropped. A name the draft does not carry fails the run."
        type: string
        default: "spectraMR.pdf"

# A deposition token is not a repository credential: nothing here needs write
# access to the tree, and the token arrives through `secrets`, scoped to the one
# step that uses it.
permissions:
  contents: read

jobs:
  deposit:
    runs-on: ubuntu-latest
    # A DEPLOYMENT GATE, not a secret home. ZENODO_TOKEN is a repository-scope
    # secret (owner decision, 2026-09-04) and resolves with or without this key.
    # What the key buys is the `spectramr` environment's required reviewer and
    # its `main` branch policy -- a job that names no environment is subject to
    # neither. Removing this line would not fail: it would run an irreversible
    # deposition unreviewed, from any ref, and look identical in the logs.
    environment: spectramr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Same builder release.yml uses, so the archived artefact is byte-identical
      # to the published one. It reads src/spectramr/__init__.py as TEXT, so this
      # job needs none of the package's 5.1 GB of dependencies.
      - run: pip install build twine
      - name: Build and verify the distribution
        run: python scripts/release/build_dist.py

      # Rehearsed before it is trusted: the dry run constructs the exact payload
      # and touches no network, so a malformed .zenodo.json fails here rather than
      # halfway through a deposition that has already reserved a DOI.
      - name: Rehearse the payload
        run: python scripts/release/zenodo_deposit.py --dry-run

      - name: Deposit
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          # Through env, never interpolated into the command line: a workflow input
          # is attacker-influenced text in the general case, and pasting it into a
          # shell string is the standard script-injection seam.
          PUBLISH: ${{ inputs.publish }}
          SANDBOX: ${{ inputs.sandbox }}
          # Read by the script straight from the environment. A filename input has
          # no safe spelling inside the `$args` word-splitting below -- that pattern
          # is sound for boolean flags and is the injection seam for anything else.
          ZENODO_CARRY_FORWARD: ${{ inputs.carry_forward }}
        run: |
          args=""
          [ "$PUBLISH" = "true" ] && args="$args --publish"
          [ "$SANDBOX" = "true" ] && args="$args --sandbox"
          python scripts/release/zenodo_deposit.py $args
