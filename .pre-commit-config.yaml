repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]  # YAML may contain custom tags
        # conda/meta.yaml is a Jinja2 TEMPLATE, not YAML: it opens with
        # `{% set version = ... %}` and PyYAML stops at the `%` in column 2.
        # `--unsafe` does not help -- it relaxes tag RESOLUTION, not
        # tokenization, so no setting of this hook can parse the file. It
        # ships publicly, failing this hook, and nothing noticed because the
        # only lane running pre-commit is `continue-on-error`. Excluded
        # rather than skipped, so the other ~1,900 YAML files stay covered.
        exclude: ^conda/meta\.yaml$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/spectramr/(core|config|domain)/
        additional_dependencies: [pydantic>=2.6, types-PyYAML]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # `astroid` is pylint's AST library (a real distribution name in
        # uv.lock), not a misspelling of "asteroid".
        # `unparseable` is the word scripts/ci/migrate_config_keys.py prints in
        # its own summary line (":576"), so docs quoting that output must spell
        # it the way the tool does, not the way the dictionary prefers.
        # `tre` is the registered alias for `target_registration_error`
        # (`core/metrics/report_step_metrics.py:283`), a metric name the docs
        # must spell as the registry does -- same reason as `te` above.
        # `nce` is Noise-Contrastive Estimation: it appears only as a LaTeX
        # subscript in the InfoNCE loss formulas on losses_reference.rst.
        # `strat` is a real identifier in two independent places, not a
        # misspelling of "start"/"strata":
        #   - a local abbreviation for `strategy_class`
        #     (`config_health_checker.py:12441` and 11 more), in the tree since
        #     the spectraMR rename (c2d17404a) -- codespell had been failing on
        #     every commit that touched that file;
        #   - the conventional local name for a strategy instance across
        #     tests/unit/infrastructure/training/strategies/ (144 occurrences in
        #     the 30 files issue #1918 touched alone).
        args: ["--ignore-words-list=mse,nd,te,ot,fpr,astroid,unparseable,tre,nce,strat"]

  # Workflow YAML is load-bearing now: pr-required.yml gates every merge.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        # WIDENED from this hook's default `^\.github/workflows/`. The
        # workflows that actually execute in the PUBLISHED repository live
        # under scripts/release/public_overlay/.github/workflows/ -- the
        # export maps them onto .github/workflows/ (NN21's second write
        # path). At the default root this hook has only ever linted the
        # private copies, which never run: green on the easy shape, blind
        # to the one that ships. A syntax error there would surface only
        # after an irreversible publish.
        files: ^(\.github|scripts/release/public_overlay/\.github)/workflows/

  - repo: local
    hooks:
      # ALWAYS-RUN. No `files:` filter and `always_run: true`, so this fires on
      # every commit regardless of which paths the commit touches. That is the
      # point: the defect it catches is invisible to a path-scoped check. During
      # the most recent package rename, a clean three-way merge carried two
      # imports of the retired package into a file nobody had listed as
      # affected -- the merge routed hunks by path and never inspected their
      # contents. Only a whole-tree content scan saw it.
      #
      # This comment does not spell the retired name, and that is not squeamish:
      # the check is content-based, so a literal here would make the config file
      # its own first offender. The guard demonstrated this by going red on an
      # earlier draft of these very lines.
      #
      # `language: python` rather than `system` because the rule owner it
      # imports (tests/architecture/test_no_stale_package_name.py) imports
      # pytest at module scope, and the CI job that runs `pre-commit run
      # --all-files` installs pre-commit alone. The hook provisions its own.
      - id: no-stale-package-name
        name: no pre-rename package name anywhere in the tree
        entry: python scripts/ci/check_no_stale_package_name.py
        language: python
        additional_dependencies: [pytest]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      # Replaces the whole-file `ruff` + `ruff-format` hooks from
      # astral-sh/ruff-pre-commit, which failed a one-line edit on debt the commit
      # did not write and, carrying `--fix`, rewrote the working tree on the way out
      # (#1874). One owner for the added-line policy now, shared with the blocking
      # `lint-diff` lane, so the hook and CI can no longer disagree about a commit.
      # The script derives its own file list from the index, hence
      # `pass_filenames: false`; `types:` still decides whether it runs at all, and
      # `always_run` would escape that. `language: python` pins ruff here rather than
      # trusting the committer's PATH (#1981) -- keep it at or above the `ruff>=0.15`
      # floor in pyproject.toml, which a pin eleven minor versions below once broke.
      - id: ruff-changed-lines
        name: ruff, on the lines this commit adds
        entry: python scripts/ci/lint_changed_lines.py --staged
        language: python
        additional_dependencies: [ruff==0.16.2]
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
      - id: test-paired-with-source
        name: source change requires paired test change
        entry: python scripts/ci/check_test_paired_with_source.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: witness-corpus
        name: witness corpus (no newly-discarded declared keys)
        entry: python scripts/ci/check_witness_corpus.py experiments/inprogress
        language: system
        pass_filenames: false
        files: ^experiments/inprogress/.*\.yaml$
      # A SECOND tree needs a SECOND hook id and its own baseline. Reusing the
      # id above with a different root would share one debt record between two
      # corpora: run against tests/audit/corpus it reported all 2658 experiments
      # entries as "now clean" and invited an --update-baseline that would have
      # erased them (#1930). The audit fixtures start at zero, so a fixture
      # declaring a key the schema discards -- the #1933 defect, which made a
      # planted violation carry none of the shape it advertised -- fails here on
      # the commit that introduces it.
      - id: witness-corpus-audit-fixtures
        name: audit fixtures declare no key the schema discards
        entry: >-
          python scripts/ci/check_witness_corpus.py tests/audit/corpus
          --baseline scripts/ci/witness_baseline_audit_corpus.txt
        language: system
        pass_filenames: false
        files: ^tests/audit/corpus/.*\.yaml$
      - id: identity-paths-unique
        name: no two arms write to the same identity path
        entry: python scripts/ci/check_identity_paths_unique.py experiments/inprogress
        language: system
        pass_filenames: false
        files: ^experiments/inprogress/.*\.yaml$
