repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]  # YAML may contain custom tags
        # conda/meta.yaml is a Jinja2 TEMPLATE, not YAML: it opens with
        # `{% set version = ... %}` and PyYAML stops at the `%` in column 2.
        # `--unsafe` does not help -- it relaxes tag RESOLUTION, not
        # tokenization, so no setting of this hook can parse the file. It
        # ships publicly, failing this hook, and nothing noticed because the
        # only lane running pre-commit is `continue-on-error`. Excluded
        # rather than skipped, so the other ~1,900 YAML files stay covered.
        exclude: ^conda/meta\.yaml$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  # The rev must not fall behind the `ruff>=0.15` floor in pyproject.toml. It
  # did: this hook was pinned to v0.5.0, eleven minor versions below the floor,
  # so it reformatted files into a style the project's own ruff immediately
  # reverted -- `ruff format --check` reported "1 file would be reformatted" on
  # a file this hook had just written. Two formatters with different opinions
  # and no owner is a formatting war, not a gate (non-negotiable 17).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/spectramr/(core|config|domain)/
        additional_dependencies: [pydantic>=2.6, types-PyYAML]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # `astroid` is pylint's AST library (a real distribution name in
        # uv.lock), not a misspelling of "asteroid".
        # `unparseable` is the word scripts/ci/migrate_config_keys.py prints in
        # its own summary line (":576"), so docs quoting that output must spell
        # it the way the tool does, not the way the dictionary prefers.
        args: ["--ignore-words-list=mse,nd,te,ot,fpr,astroid,unparseable"]

  # Workflow YAML is load-bearing now: pr-required.yml gates every merge.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        # WIDENED from this hook's default `^\.github/workflows/`. The
        # workflows that actually execute in the PUBLISHED repository live
        # under scripts/release/public_overlay/.github/workflows/ -- the
        # export maps them onto .github/workflows/ (NN21's second write
        # path). At the default root this hook has only ever linted the
        # private copies, which never run: green on the easy shape, blind
        # to the one that ships. A syntax error there would surface only
        # after an irreversible publish.
        files: ^(\.github|scripts/release/public_overlay/\.github)/workflows/

  - repo: local
    hooks:
      # ALWAYS-RUN. No `files:` filter and `always_run: true`, so this fires on
      # every commit regardless of which paths the commit touches. That is the
      # point: the defect it catches is invisible to a path-scoped check. During
      # the most recent package rename, a clean three-way merge carried two
      # imports of the retired package into a file nobody had listed as
      # affected -- the merge routed hunks by path and never inspected their
      # contents. Only a whole-tree content scan saw it.
      #
      # This comment does not spell the retired name, and that is not squeamish:
      # the check is content-based, so a literal here would make the config file
      # its own first offender. The guard demonstrated this by going red on an
      # earlier draft of these very lines.
      #
      # `language: python` rather than `system` because the rule owner it
      # imports (tests/architecture/test_no_stale_package_name.py) imports
      # pytest at module scope, and the CI job that runs `pre-commit run
      # --all-files` installs pre-commit alone. The hook provisions its own.
      - id: no-stale-package-name
        name: no pre-rename package name anywhere in the tree
        entry: python scripts/ci/check_no_stale_package_name.py
        language: python
        additional_dependencies: [pytest]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: test-paired-with-source
        name: source change requires paired test change
        entry: python scripts/ci/check_test_paired_with_source.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: witness-corpus
        name: witness corpus (no newly-discarded declared keys)
        entry: python scripts/ci/check_witness_corpus.py experiments/inprogress
        language: system
        pass_filenames: false
        files: ^experiments/inprogress/.*\.yaml$
