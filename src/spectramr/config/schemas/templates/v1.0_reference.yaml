#       - contrast_type: 'spin_echo'             # options: 'spin_echo', 'inversion_recovery', 'gradient_echo', 'diffusion_weighted', 'ssfp', 'mprage'
#   perfusion:
#     aif_source: 'population'                   # options: 'population', 'measured'
#     kinetic_model: 'extended_tofts'            # options: 'extended_tofts'
#   phase_contrast:
#     encoding_scheme: 'four_point_reference'    # options: 'four_point_reference'
#     through_plane_axis: 'z'                    # options: 'x', 'y', 'z'
#   spectroscopy:
#     signal_model: 'mrs_lorentzian'             # options: 'mrs_lorentzian'
#   target_contrast:
#     normalization: 'percentile'                # options: 'percentile', 'zscore', 'minmax', 'none'
#   target_mode: 'complex_mean'                  # options: 'complex_mean', 'phase_aligned_mean', 'rep_pair', 'r2r', 'nullspace_r2r'

# ============================================================================
# MODEL CONFIGURATION  (ModelConfigSchema)
# ============================================================================
model:
  # options: see MODEL_REGISTRY (>500 entries) — populated via
  # spectramr.models.init_registry.populate_model_registry().
  # Common: 'unet', 'standard_unet', 'enhanced_unet', 'attention_unet',
  # 'mamba_unet', 'vit', 'swin', 'fno', 'score_based', 'mamba_reconstruction',
  # 'unet_3d', 'vnet', 'unetr', etc.
  model_type: 'standard_unet'
  in_channels: 2                   # complex data as interleaved (real, imag)
  out_channels: 2
  base_channels: 64
  depth: 4
  spatial_dims: 2                  # options: 2, 3
  input_type: 'image'              # options: 'image', 'kspace', 'sinogram', 'frequency'
  output_activation: null
  target_domain: null
  model_kwargs: {}

  # Latent / generative scalars.
  z_dim: 256
  kan_type: 'BSpline'              # options: 'BSpline', 'RBF', 'Wavelet' (see KANType)
  wavelet_type: null
  wav_version: null

  # Weight init.
  weight_init_type: 'he_normal'    # options: 'he_normal', 'xavier_uniform', 'orthogonal', ...
  weight_init_gain: 1.0
  weight_init_activation: 'relu'   # options: 'relu', 'leaky_relu', 'gelu', 'silu', 'tanh', 'sigmoid'
  apply_weight_init: true

  # Conditioning chain (FiLM / concat / sum into encoder).
  conditioning:
    enabled: false
    sources: []
    embed_dim: 128
    fusion: 'concat'               # options: 'concat', 'sum'
    injection: 'film'              # options: 'film'
    encoder_kwargs: {}

# ============================================================================
# TRAINING CONFIGURATION  (TrainingStrategyConfigSchema)
# ============================================================================
  model_domain: 'image'    # options: 'image', 'kspace'
training:
  # options: see TrainingStrategyFactory.STRATEGY_CLASS_PATHS
  # (spectramr.infrastructure.training.strategy_factory) — short alias OR
  # full dotted path. Short names include 'gan', 'diffusion', 'vae',
  # 'reconstruction', 'ssl', 'mae', 'pinn', 'physics_driven',
  # 'domain_adaptation', 'cycle_bloch', 'virtual_fiducial',
  # 'flow_matching', 'rectified_flow', 'tto', 'multi', 'x_diffusion',
  # 'sle_compressed_sensing', and many more (>100 entries in v6.1).
  strategy_class: 'spectramr.infrastructure.training.strategies.diffusion.DiffusionTrainingStrategy'

  epochs: 100
  max_iterations: 50000
  max_steps_per_epoch: null
  # Whether the iteration budget above is counted per rank or across the whole
  # job. Under DDP the two differ by world_size, so a run that means 'global'
  # and leaves this at the default trains world_size times longer than intended.
  iteration_budget_scope: 'per_rank'   # options: 'per_rank', 'global'
  task: null
  device: null                     # null → inherits top-level device
  output_dir: null

  # Active paradigm block — pick exactly one to fill out below.
  # v6.1 highlights diffusion; alternatives are shown commented.
  diffusion:
    timesteps: 1000
    noise_schedule: 'cosine'       # options: null, 'linear', 'cosine', 'sqrt', 'quadratic'
    sampler: 'ddpm'                # options: 'ddpm', 'ddim', 'pndm', 'lms', 'euler', 'euler_a'
    sampling_steps: 100
    cond_drop_prob: 0.1
    guidance_scale: 7.5
    prediction_type: 'epsilon'     # options: 'epsilon', 'sample', 'v_prediction'
    enable_diffusion_amp: false
    enforce_output_range: true
    lambda_mse: 1.0

# --- remaining fields of this block that have a constrained value set. -----
