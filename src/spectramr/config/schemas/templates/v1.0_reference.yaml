#     beta_schedule: 'cosine'                    # options: 'cosine', 'linear'

  # Alternative paradigm sub-blocks (commented — only one active at a time,
  # but each is a real schema field accepted here).
  #
  # vae / latent:
  # latent:
  #   latent_dim: 256
  #   beta_kl: 1.0
  #   anneal_kl_beta: false
  #   kl_anneal_steps: 10000
  #   latent_loss_type: 'kl_divergence'  # options: 'kl_divergence', 'vq', 'commit'
  #   n_embeddings: 512
  #   embedding_dim: 64
  #
  # gan:
  #   phase_schedule: null              # ProGAN phase boundaries (list[int])
  #   progan_gradient_penalty_lambda: 10.0
  #   beta_tc_weight: 1.0
