# v1.0 Reference Configuration Template — the schema SSOT
# =======================================================
#
# The canonical, load-passing reference for the CURRENT schema. Copy this file,
# change the values you care about, and your YAML round-trips through
# ``TrainingSettings.from_yaml()``. When the schema and a doc disagree, this
# file is the one that is executable — it is loaded by the test suite, so it
# cannot drift silently the way prose can.
#
# WHAT "COMPREHENSIVE" MEANS HERE, precisely — the claim is about CHOICES, not
# about every field. EVERY field whose annotation is an Enum or a
# ``Literal[...]`` is documented and carries an inline ``# options:`` comment
# holding the complete allowed set, and EVERY top-level block appears. That is
# a closed claim rather than a sample, and
# ``tests/unit/config/test_reference_template_options.py`` re-derives it from
# the Pydantic models on every run: a list that drifts fails, a new Enum field
# with no entry fails, a key with no field behind it fails.
#
# Deliberately stated as "every" and not as a number. The count was 153 when
# this was written and 154 one merge later; a hardcoded total in prose is the
# same species of rot the test exists to catch, and nothing would have checked
# it. Run the test if you want today's figure.
#
# Deliberately NOT covered, because a list would be noise rather than
# documentation: plain ``bool`` fields — the large majority, and "true, false"
# tells you nothing — and free-form scalars (numbers, paths, kwargs dicts). Dispatch-key
# fields whose value set is a REGISTRY rather than an annotation carry a
# pointer instead of a list; the same test asserts the pointed-at symbol still
# imports.
#
# Documentation for a field you are not using is COMMENTED, one convention
# throughout: ``# `` followed by the exact line it would be live. Uncomment and
# it is valid YAML at the right depth. The comment marker is not indentation —
# writing ``  #   key:`` where ``  # key:`` is meant silently reparents the key
# into the block above it, which is how two examples here ended up documented
# as children of ``dataset_type``.
#
# The three files under ``experiments/`` with similar names are NOT peers of
# this one and should not be copied from: both
# ``experiments/shared/training_config_schema_reference{,_new}.yaml`` are
# byte-identical to each other and declare ``config_version: '5.0'``, which the
# loader REFUSES, and ``experiments/templates/categorical_values_reference.yaml``
# is a hand-written option catalogue that has rotted in both directions (on
# ``training_mode`` alone: 3 members that no longer exist, 6 missing). This
# file is the only one that is executed, and therefore the only one that is
# true.
#
# Schema policy (CLAUDE.md):
#
#   * ``extra="forbid"`` — every key MUST trace back to a real Pydantic field,
#     top-level and nested. An unknown key makes the YAML unloadable. Comment
#     unused blocks out rather than deleting the documentation.
#   * The settings object is ``frozen=True`` after load.
#   * Declare ``CANONICAL_CONFIG_VERSION``. ``6.0``/``6.1`` still load — the
#     loader folds them — but ``check_config_version_is_canonical`` reports a
#     legacy declaration as an ERROR, because the fold is what is draining.
#
# History, so nothing is assumed lost. This file was ``v6.1_reference.yaml``;
# ``v6.0_reference.yaml`` was retired alongside the rename. That was measured,
# not asserted: of v6.0's 239 documented paths, 41 were unique to it and ALL 41
# were legacy spellings whose canonical target v6.1 already carried (0 had a
# canonical target absent here). So v6.0 documented no functionality this file
# does not — it documented the same functionality in the retired spelling, which
# is exactly what a reference should stop teaching. Its 41 staged keys were also
# the entire template-root contribution to the rename countdown.
#
# The 6.1 additions it introduced are all still here and still the reference for
# their features: ``physics.concomitant`` (CAUR — Maxwell concomitant fields),
# ``physics.relaxation_priors`` (Bloch-constrained translation T1/T2),
# ``physics.gradient_waveform_uri`` (pulse-sequence co-design), ``acquisition:``
# (PILOT codesign + BALD active acquisition), ``certification:`` (conformal /
# CHD / PRC / PAC-Bayes / badge), ``audit:`` (KSD Tier-3 defensibility) and
# ``mrf:`` (MR-fingerprinting acquisition metadata).
#
# This template is exercised by
# ``tests/unit/config/test_reference_templates_experiment_name.py`` —
# any schema drift that breaks ``from_yaml()`` on this file fails CI
# loudly.

# The ONLY accepted value. PR #891 emptied ``LEGACY_CONFIG_VERSIONS``, so
# ``ACCEPTED_CONFIG_VERSIONS`` is now exactly ``{'1.0'}`` and ``settings.py``
# RAISES on anything else -- legacy '6.0'/'6.1' are refused, NOT folded. This
# line used to say they still load, and this is the file people copy from.
config_version: '1.0'


# ============================================================================
# DATA CONFIGURATION  (DataConfigSchema)
# ============================================================================
data:
  # How samples are batched and moved to the device (phase 9).
  loader:
    batch_size: 16
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true

  # How multi-coil data is reduced before the model sees it.
  coils:
    processing_mode: 'none'                      # options: 'none', 'flatten', 'svd', 'magnitude', 'rss', 'rss_image', 'rss_per_channel'
    num_virtual_coils: 4

  # What representation the loader hands the model (phase 9b). Leaves drop the
  # redundant suffix -- the block name supplies the noun, as with `expose:`.
  domain:
    # must agree with what the model consumes
    output: 'image'                              # options: 'image', 'kspace'
    target_channels: 1     # 1 for RSS, >1 for multi-contrast
    input_artifact: null   # override the task's default artifact variant
    target_artifact: null
    graph_type: null       # non-Cartesian graph delivery
    enable_graph_encoding: false
    graph_config: {}

  # What decides which records train and which validate (phase 9b). The
  # strategy sits with the companions that make it valid: 'loso' needs
  # holdout_site, 'loso_subject' needs EXACTLY ONE of holdout_subject /
  # loso_fold, 'random' needs validation_fraction.
  split:
    type: 'auto'                                 # options: 'auto', 'directory', 'manifest', 'random', 'loso', 'loso_subject'
    validation_fraction: 0.1
    holdout_site: null    # site id(s) held out entirely, for type='loso'
    train_sites: null     # null = every site except holdout_site
    holdout_subject: null # subject id held out, for type='loso_subject'
    loso_fold: null       #   ...or an index into the SORTED subject ids
    max_train_subjects: null   # smoke/debug caps; null = full split
    max_val_subjects: null

  # Extra per-sample metadata the loader emits. The block supplies the verb.
  expose:
    acquisition_params: false
    conformal_jacobian: false
    cortex_flatten_grid: false
    glm_design_matrix: false
    scanner_id: false
    field_strength: false
    site_id: false

  # `dataset_type` stays FLAT on purpose: it is a DISPATCH key, not a location.
  # dataset_instantiator, config_health_checker and DATASET_TYPE_SIGNAL_DOMAINS
  # all branch on it, and it is already the first line a reader sees.
  # options: 'kspace', 'm4raw', 'nifti', 'nifti_paired', 'contrast_aware_paired',
  #          'npy_slice', 'image', 'dicom', 'synthetic', 'preprocessed',
  #          'pde_synthetic', 'quantitative', 'cine', 'bart_kspace', 'bids_paired',
  #          'png_paired', 'field_ref', 'ismrmrd_kspace', 'oracle_bssfp', 'mrixfields'
  # (Aliases like 'fastmri_knee'/'fastmri_brain'/'volume_h5' are normalised
  # to 'kspace'; 'paired_nifti'/'paired_mri' → 'nifti_paired'; '3d' → 'nifti'.)
  dataset_type: 'kspace'

  # ── NEX (multi-repetition averaging) — REQUIRED READING for dataset_type: m4raw
  #
  # Left commented because both defaults are correct for every dataset EXCEPT
  # M4Raw. Uncomment them the moment you set `dataset_type: 'm4raw'`; a live value
  # here would advertise a knob that is inert for the other 20 dispatch types.
  #
  # M4Raw stores several PHASE-INCOHERENT repetitions per anatomy (separate
  # acquisitions with independent global phase drift). The default `complex_mean`
  # plain-averages them in complex k-space, which CANCELS signal rather than
  # averaging it: the resulting "high-SNR reference" has SNR *below a single
  # repetition* and scrambled phase. That is what drove k-space cold diffusion to
  # predict near-real k-space and emit a 180-degree centro-symmetric doubled
  # brain. `phase_aligned_mean` aligns each repetition's global phase to rep 0
  # first, which is what actually buys the sqrt(N) SNR.
  #
  # target_mode: 'phase_aligned_mean'     # options: 'complex_mean', 'phase_aligned_mean', 'rep_pair', 'r2r', 'nullspace_r2r'
  #                                       # 'complex_mean' is legacy and destructive on M4Raw
  #
  # Leave-one-out NEX target: drop the INPUT repetition (rep 0) from the average
  # so input and target noise are uncorrelated. Without it the input's own noise
  # sits inside the target at 1/N amplitude and the supervision is biased toward
  # PRESERVING that noise. Costs sqrt(N-1) vs sqrt(N) SNR, and only engages with
  # >= 3 repetitions -- with 2 it silently falls back to the all-reps average, so
  # a mixed-repetition dataset gets a DIFFERENT target definition per contrast.
  # It changes the reference the PSNR/SSIM metrics grade against, so runs that
  # differ on it are NOT numerically comparable: flip it cohort-wide, never
  # per-arm.
  #
  # nex_target_exclude_input: false
  # nex_fallback: 'error'                 # options: 'error', 'all_reps'
  #                                       # what a <3-repetition group does under leave-one-out:
  #                                       # 'error' refuses the input-correlated all-reps reference
  # nex_registration: 'none'              # options: 'none', 'translation'
  #                                       # register repetitions onto the input before averaging (#2849)
  # nex_shift_root: null                 # directory with nex_shifts.json from precompute_m4raw_nex_shifts.py (#2977)
  # nex_shifts_missing: 'raise'           # options: 'raise', 'estimate'
  # val_target_mode: null                 # options: null, 'complex_mean', 'phase_aligned_mean', 'rep_pair'
  #                                       # NEX target for the validation split only; null serves target_mode
  # input_repetition: 'first'             # options: 'first', 'random'
  #                                       # M4Raw train split: which repetition is the model input
  # coil_maps_missing: 'raise'            # options: 'raise', 'estimate'
  #                                       # with coil_maps_root: what a group without a map file does
  # coil_maps_recipe: 'all_reps_mean'     # options: 'all_reps_mean', 'input_repetition'
  #                                       # with coil_maps_root: which repetitions the stored maps came from
  # noise_fit_support_policy: 'band'      # options: 'band', 'acs'
  # noise_covariance_root: null          # directory with noise_covariance.json from precompute_m4raw_noise_covariance.py (#3117)
  # noise_covariance_missing: 'raise'     # options: 'raise', 'fit'
  #                                       # columns the per-scan Sigma_n fit uses (self-calibrated r2r / nullspace_r2r)
  # r2r_covariance_source: 'committed'    # options: 'committed', 'self_calibrated'   (target_mode 'r2r' only)
  # r2r_whitening: 'committed'            # options: 'none', 'committed', 'self_calibrated'   (target_mode 'nullspace_r2r' only)
  #
  # acquired_pe_lines also accepts an int, or an int per contrast.
  # acquisition:
  #   phase_encode_axis: -1               # options: -1, -2
  #   acquired_pe_lines: 'measured'       # options: 'measured'
  #
  # Noise2Noise: serve a repetition stack (`kspace_reps`) on the train split and
  # no averaged target; NoiseToNoiseStrategy forms the target from the stack.
  # n2n_pairing: null                     # options: null, 'random_pair', 'one_vs_rest_mean', 'ordered'
  #                                       # 'ordered' pairs the two halves of a split target_mode
  #
  # SSOT: data/datasets/m4raw_dataset.py::_average_reps · rules: .claude/rules/data.md
  # Audit: `m4raw_nex_target_mode_declared` (advisory) flags an m4raw arm that
  # declares neither.

  # WHERE the bytes come from (phase 9g). `data_root`/`data_layout` drop the
  # `data_` prefix -- the outer block supplies it. The `_path` leaves keep their
  # full names: under the naming rule `<thing>_path` is a file, and index /
  # validation_index / paired_manifest are the things.
  source:
    root: './data'                 # the tree the arm reads from
    layout: 'flat'                 # options: 'flat', 'bids'
    index_path: null               # .pkl/.json enumerating the TRAIN split
    validation_index_path: null    # explicit VAL manifest; null = carve from index_path
    paired_manifest_path: null     # v4 paired JSON (ULF/HF records)
    preprocessing_dir: null        # a *_image/ preprocessing output tree

  # v6.0 REQUIRED: explicit [H, W, D] — no img_size/target_size auto-migration.
  # How samples are DRAWN from a volume, before anything is done to them
  # (phase 9e). The queue's three knobs finally sit together: patch_size is what
  # a sample IS, samples_per_volume how many per subject per epoch, queue_length
  # the RAM buffer holding them.
  sampling:
    patch_size: [128, 128, 32]   # (W, H, D); D=1 for 2D. A 2-tuple is normalised to D=1.
    samples_per_volume: 8
    queue_length: 64
    subject_prefetch: 'auto'                     # options: 'auto' (an explicit int >= 1 is also accepted; subjects each queue worker loads ahead)
    enable_slab_mode: false      # 2.5D: flatten depth to channels, keep middle target slice
    enable_slice_2d: false       # one sample per axial slice of a 3D paired volume
    num_synthetic_samples: 10    # fallback when the dataset resolves empty

  # NOT part of `split:` on purpose -- nothing reads test_split (issue #665),
  # and a tidy home for an inert knob implies it works.
  test_split: 0.1

  # Normalisation
  # What is done to the VALUES between disk and the model, in the order it
  # happens (phase 9d). The four booleans take the ratified `enable_<thing>`
  # spelling and each sits directly above the nouns it gates.
  processing:
    # k-space scaling
    enable_kspace_normalization: false
    kspace_percentile: 0.99
    kspace_scale_domain: 'kspace'                # options: 'kspace', 'image', 'acs'
    kspace_scale_reference: 'target'             # options: 'target', 'input'
    enable_log_scaling: false
    log_scaling_center_fraction: 0.25
    # image-domain normalisation
    normalization_type: 'none'                   # options: 'none', 'standard', 'minmax', 'percentile', 'robust_percentile'
    normalization_kwargs: {}
    enable_image_normalization: false
    enable_image_rescale: false
    # output range of minmax/percentile: normalization_kwargs.out_range (rescale_range is refused, #2739)
    rescale_percentiles: [0.0, 100.0]
    # downstream
    data_range: null                # explicit range for PSNR/SSIM; null = dynamic
    transforms: []

  # I/O shape control
  # NOT part of `domain:` on purpose -- nothing in src/spectramr reads
  # return_image_domain (it is carried in KNOWN_UNCONSUMED), and a tidy home for
  # an inert knob implies it works. Same call as data.test_split above.
  return_image_domain: false

  # What counts as the INPUT and what counts as the TARGET.
  # Named `pairing:`, not `contrast:` -- three of these fields are ULF/HF
  # field-strength pairing with no contrast content, and `data.contrast` would
  # collide with `data.input_contrast`/`data.target_contrast` below, which are
  # per-contrast NORMALIZATION specs rather than selection filters.
  pairing:
    # input side; null = load everything available
    # M4Raw cross-contrast route only (dataset_type: m4raw, single_contrast: false); live, they are refused otherwise:
    # cross_contrast_source: 'T1'                # options: 'T1', 'T2', 'FLAIR'
    # source_layout: 'stacked'                   # options: 'stacked', 'separate', 'target_only'
    contrasts: null                 # e.g. ['T1w', 'FLAIR']
    sessions: null                  # e.g. ['01', '02']
    # target side; each null = mirror its input counterpart above
    target_contrasts: null          # e.g. ['T2w']
    target_sessions: null
    # pairing off entirely: each sample is one contrast, repetition-averaged
    single_contrast: false
    # which end of a ULF/HF pair is the input; name is <input>_to_<target>.
    # 'hf_to_hf'/'ulf_to_ulf' autoencode one field and DROP the opposite arm.
    bidirectional_mode: 'ulf_to_hf'              # options: 'ulf_to_hf', 'hf_to_ulf', 'hf_to_hf', 'ulf_to_ulf'
    hf_resolution: null                          # options: null, 'highres', 'lowres', 'unknown'
    # admit records with no partner (validation/inference on unpaired ULF)
    allow_unpaired: false

  # Exposure flags — opt-in surfaces for the downstream Dataset/Strategy
  # (see DataConfigSchema.expose_*). All default to False.
  # NOT part of `sampling:` on purpose -- nothing reads phase_encode_axis from
  # the config (FMRIVolumeDataset takes it as a constructor default, and no
  # dataset_type selects that class). Same call as test_split / return_image_domain.
  phase_encode_axis: null          # options: null, -2, -1

  # Augmentation (TorchIO-driven).
  augmentation:
    enabled: false
    probability: 0.5
    enable_rotation: false
    enable_flip: false
    enable_noise: false
    enable_bias_field: false
    enable_motion_blur: false
    enable_rician_noise: false
    enable_ghosting: false
    enable_spike: false
    enable_b0_distortion: false
    enable_mixup: false
    enable_cutmix: false

  # Caching policy.
  caching:
    strategy: 'none'               # options: 'none', 'ram', 'disk'
    staging_behavior: 'full'       # options: 'full', 'progressive'
    cleanup_trigger: 'session_end' # options: 'session_end', 'epoch_end', 'never'

  # Collation policy (Phase-4 universal collator).
  collation:
    # options: null, 'image', 'slab', 'graph', 'sequence', 'mixed',
    #          'robust', 'physics'
    strategy: null
    padding_mode: 'zeros'          # options: 'zeros', 'reflect', 'replicate'
    padding_value: 0.0
    allow_variable_shapes: false
    validate_nans: true

  # --- remaining fields of this block that have a constrained value set. -----
  # Commented because each would otherwise change what the template resolves
  # to; uncomment the lines you need. Generated from the schema -- see
  # tests/unit/config/test_reference_template_options.py, which fails if any
  # list here stops matching its Enum/Literal.
  #   slab_target_mode: 'middle'                   # options: 'middle', 'flatten', 'keep'

  # Resample / crop helpers.
  resample:
    enabled: false
    strategy: 'reference'          # options: 'reference', 'isotropic'
    interpolation: 'bspline'       # options: 'nearest', 'linear', 'bspline'
    anti_aliasing: true

  crop_or_pad:
    enabled: false
    padding_mode: 'reflect'        # options: 'zero', 'reflect', 'edge', 'mean'
    crop_strategy: 'center'        # options: 'center', 'foreground', 'corner'

  # Acquisition metadata expose block.
  acquisition_metadata:
    enabled: false
    source: 'bids_json'            # options: 'bids_json', 'dicom', 'h5_attrs', 'yaml_inline'
    fields: []
    strict: false

  # Quantitative-map regression (Phase 4b).
  quantitative:
    enabled: false
    target_maps: []
    units: 'physical'              # options: 'physical', 'normalized'

  # --- remaining fields of this block that have a constrained value set. -----
  # Commented because each would otherwise change what the template resolves
  # to; uncomment the lines you need. Generated from the schema -- see
  # tests/unit/config/test_reference_template_options.py, which fails if any
  # list here stops matching its Enum/Literal.
  #   input_source: null                           # options: null, 'contrasts', 'maps'

  # Temporal / cine (Phase 4c).
  temporal:
    enabled: false
    frames_per_window: 8
    frame_axis: 3                  # options: 0, 1, 2, 3
    temporal_overlap: 2

  # --- remaining fields of this block that have a constrained value set. -----
  # Commented because each would otherwise change what the template resolves
  # to; uncomment the lines you need. Generated from the schema -- see
  # tests/unit/config/test_reference_template_options.py, which fails if any
  # list here stops matching its Enum/Literal.
  #   target_source: null                          # options: null, 'sibling', 'self'

  # fMRI (4-D BOLD series). Distinct from `temporal:` above, which is cine:
  # both carry a `target_source`, but they are different fields with different
  # vocabularies -- cine also accepts 'self', fMRI does not.
  fmri:
    enabled: false
    volume_glob: '**/*.nii*'
    tr_seconds: 0.72
    phase_encode_axis: -2
    target_suffix: '_target'

  # --- remaining fields of this block that have a constrained value set. -----
  # Commented because each would otherwise change what the template resolves
  # to; uncomment the lines you need. Generated from the schema -- see
  # tests/unit/config/test_reference_template_options.py, which fails if any
  # list here stops matching its Enum/Literal.
  #   target_source: null                          # options: null, 'sibling'

  # Multi-domain / domain adaptation.
  multi_domain:
    enabled: false
    domains: []
    balancing: 'round_robin'       # options: 'round_robin', 'stratified', 'concat'
    target_supervised: false

  # Latent diffusion (Stage-1 autoencoder reuse).
  latent_diffusion:
    enabled: false
    stage1_checkpoint: null
    latent_key: 'latent'

  # Coordinate grid emission (e.g., for INR / SIREN consumers).
  emit_coordinates:
    enabled: false
    normalize: true
    include_batch_dim: true

  # Meta-learning batches.
  meta_learning:
    enabled: false
    support_size: 4
    query_size: 4
    tasks_per_epoch: 100

  # Optional manifest-driven roles.
  manifest_roles:
    inputs: []
    targets: []
    auxiliary: []

# --- remaining fields of this block that have a constrained value set. -----
# Commented because each would otherwise change what the template resolves
# to; uncomment the lines you need. Generated from the schema -- see
# tests/unit/config/test_reference_template_options.py, which fails if any
# list here stops matching its Enum/Literal.
#   bart:
#     density_compensation: 'none'               # options: 'none', 'radial', 'iterative'
#     sampling: 'cartesian'                      # options: 'cartesian', 'radial', 'spiral', 'non_cartesian'
#     trajectory_source: 'none'                  # options: 'none', 'golden_angle', 'sibling_cfl', 'ismrmrd'
#   datasets:
#     - split: 'train'                           # options: 'train', 'val', 'both'
#   input_contrast:
#     normalization: 'percentile'                # options: 'percentile', 'zscore', 'minmax', 'none'
