  # pnp:                                # Plug-and-play denoiser strategy
  #   enabled: false
  #   iterations: 50
  #   rho: 1.0
  #   spectral_norm_iters: 1
  #   denoiser_lipschitz_constant: 1.0
  #
  # multi:                              # Pipeline / multi-stage curriculum
  #   stages: []
  #   routines: {}
  #   flow: []
  #   evaluate_intermediates: true
  #
  # multi_parameter:                    # Bloch multi-parameter regression
  #   parameters: []
  #   uncertainty_weighting: true
  #   bloch_consistency_lambda: 0.5
  #   n_contrasts: 3
  #
  # scattering_besov:                   # B-1.3 scattering-Besov detail prior (MRIxFields ->7T)
  #   lambda_scatter: 0.5              # weight of the detail prior (0 => L1-only control)
  #   n_scales: 3                      # wavelet scales in the (fixed, parameter-free) filterbank
  #   n_orientations: 4               # orientations per scale
  #   besov_s: 1.0                    # Besov exponent; 2^(j*s) up-weights finer scales
  #   scatter_weight: 1.0             # internal weight of the scattering (modulus) component
  #   besov_weight: 1.0               # internal weight of the Besov (regularity) component

# ============================================================================
# OPTIMIZATION CONFIGURATION  (OptimizationConfigSchema)
# ============================================================================
optimization:
  # Five named sub-blocks. The flat spellings (optimization.learning_rate, ...)
  # still LOAD -- a mode="before" validator folds each into its sub-block -- but
  # they are retired: nothing in Python can read them, and
  # scripts/ci/check_no_legacy_config_keys.py counts how many arms still use
  # them. Write the nested form in anything new.

  optimizer:
    # Closed vocabulary — see OptimizerType in config/schemas/enums.py. Case and
    # a small alias table are normalised; an unknown name raises at load time.
    #   torch:   'adam', 'adamw', 'sgd', 'rmsprop', 'adamax', 'nadam', 'radam',
    #            'adagrad', 'adadelta', 'asgd', 'rprop', 'adafactor',
    #            'lbfgs', 'sparseadam'   (the last two accept no weight_decay)
    #   in-repo: 'lars', 'lamb', 'lion'
    #   extras:  'adam8bit', 'adamw8bit'          -> pip install -e '.[bnb]'
    #            'schedulefree_adamw', 'schedulefree_sgd' -> '.[schedulefree]'
    type: 'adamw'
    learning_rate: 1.0e-4
    generator_learning_rate: null  # GAN: split G/D LR (null → use learning_rate)
    discriminator_learning_rate: null
    weight_decay: 1.0e-5
    # Either the scalar pair OR `betas`, not both with different values.
    beta1: 0.9
    beta2: 0.999
    # betas: [0.9, 0.999]          # takes precedence over beta1/beta2
    nesterov: null                 # SGD / LARS
    amsgrad: null                  # Adam / AdamW
    kwargs: {}                     # validated against the optimizer's signature

    # Per-parameter-group overrides, keyed by a named_parameters() prefix. A key
    # matching zero parameters RAISES (a renamed submodule must not silently
    # degrade the arm to a uniform LR).
    # param_groups:
    #   residual_head:
    #     learning_rate: 1.0e-5    # or lr_multiplier, not both
    #     weight_decay: 0.0
    #     freeze: false            # freeze != lr 0: a zero-LR group still decays

    # Lookahead (Zhang et al. 2019) wraps the resolved base optimizer. A wrapper,
    # not an optimizer type value — it has no meaning without an inner optimizer.
    lookahead:
      enabled: false
      sync_period: 5               # the paper's k / la_steps
      alpha: 0.5

    # NOTE: there is deliberately no `sam:` block and 'sam' is NOT a legal
    # optimizer type. SAM needs two forward+backward passes per step, so it needs
    # the closure that only StepExecutor holds -- it returns with
    # optimizers/sharpness_aware_stepper.py. A `sam:` block shipped here briefly
    # with zero readers; declaring it validated and did nothing.

  # Everything between loss.backward() and optimizer.step().
  gradient:
    accumulation_steps: 1
    enable_checkpointing: false    # trade compute for activation memory
    detect_anomalies: false        # torch.autograd anomaly mode; global, 2-4x slower
    activation_offload: none       # options: 'none', 'cpu'
    clip:
      enabled: true
      method: 'norm'               # options: 'norm', 'value'
      value: 1.0

  # Autocast. Note the third state: dtype 'float32' disables AMP even when
  # enabled is true, which is how an arm asks for fp32 without touching the flag.
  precision:
    enabled: true
    dtype: null                    # null/'float16' → fp16, 'bfloat16', 'float32'

  # torch.compile. Compilation failure RAISES — asking for a compiled model and
  # silently training an eager one is a lie about what ran. enabled: false is
  # how you ask for eager.
  compile:
    enabled: false
    # options: 'default', 'reduce-overhead', 'max-autotune', 'max-autotune-no-cudagraphs'
    mode: 'default'
    backend: 'inductor'            # validated against torch._dynamo.list_backends()
    fullgraph: false
    dynamic: true

  # Diagnostics only — none of these change what the run computes.
  memory:
    enable_monitoring: false
    monitoring_interval: 50
    enable_fragmentation_mitigation: false
    cleanup_interval: 100
    enable_batch_size_optimization: false
    safety_margin: 0.8

  # LR scheduling — still FLAT, but #662 is FIXED (2026-08-08). The strategy
  # alone now resolves: `lr_scheduler_strategy: cosine` with no `scheduler:`
  # dict anneals over training.max_iterations. Before the fix it resolved to no
  # scheduler at all, so 531 corpus arms trained at a constant LR while their
  # config said cosine. Only a DECLARED strategy is honoured — the default
  # below is not, or the 305 arms that declare nothing would all start annealing.
  # A `scheduler:` dict is needed only to parameterise the family.
  #
  # 'warmup' / 'linear_warmup' / 'warmup_cosine' also require warmup_steps > 0:
  # the alias resolves the decay half only, so without it the warmup the name
  # promises would be silently dropped. The resolver raises instead.
  # options: 'cosine', 'cosine_annealing', 'cosine_annealing_warm_restarts',
  #          'step', 'linear_decay', 'exponential', 'plateau', 'constant',
  #          'warmup', 'linear_warmup', 'warmup_cosine'
  lr_scheduler_strategy: 'cosine'
  warmup_steps: 0
  lr_scheduler_kwargs: {}
  # scheduler:
  #   T_max: 50000
  #   eta_min: 1.0e-6
  #   warmup_steps: 500

# ============================================================================
# LOSSES CONFIGURATION  (LossConfigSchema — Single Source of Truth)
# ============================================================================
losses:
  # How the objective is ASSEMBLED, as opposed to which terms are in it.
  # `exclude_defaults` is NOT a negated boolean -- it is a list of loss NAMES to
  # leave out, so there is nothing to invert.
  policy:
    output_domain: 'image'        # options: '', 'image', 'kspace', 'complex_image'
                                  # required once any *_losses list is used
    exclude_defaults: []          # e.g. ['mse'] drops the paradigm's implicit MSE

  # Declarative loss lists. Each entry is a LossComponentConfig
  # (name + weight + enabled + kwargs). The 'name' string is looked
  # up in the LossRegistry (spectramr.models.losses).
  image_losses:
    - name: 'l1'
      weight: 1.0
      enabled: true
      kwargs: {}
    - name: 'ssim'
      weight: 0.1
      enabled: true
      kwargs: {}

  kspace_losses: []
  complex_losses: []

  # INERT: zero readers and zero corpus declarations (issue #676). Left flat --
  # a tidy home would imply they work.

  # Per-paradigm legacy weights (ReconstructionLossesConfig).
  reconstruction:
    enable_l1: true
    lambda_l1: 10.0
    enable_perceptual: false
    lambda_perceptual: 10.0
    enable_ssim: false
    lambda_ssim: 0.0
    enable_lpips: false
    lambda_lpips: 0.0
    enable_hfen: false
    lambda_hfen: 0.0
    loss_type: 'l1'                # options: 'l1', 'l2', 'huber', 'mse'

  # GAN losses.
  gan:
    enable_adversarial: false
    lambda_adv: 1.0
    enable_gradient_penalty: false
    lambda_gp: 10.0
    # options: 'wgan-gp', 'hinge', 'bce', 'lsgan', 'wgan', 'wgan_softplus', 'vanilla'
    gan_loss_type: 'wgan-gp'
    disc_updates: 1
    label_smoothing: 0.0

  # Diffusion losses.
  diffusion:
    enable_diffusion: true
    lambda_mse: 1.0
    prediction_type: 'epsilon'     # options: 'epsilon', 'sample', 'v_prediction'
    timesteps: 1000
    noise_schedule: 'cosine'       # options: 'linear', 'cosine', 'sqrt', 'quadratic'
    sampler: 'ddpm'

  # Physics-informed losses.
  physics:
    enable_bloch_residual: false
    lambda_bloch_residual: 1.0
    enable_physics_constraint: false
    lambda_physics_constraint: 0.1
    enable_parallel_imaging: false
    lambda_parallel_imaging: 1.0
    enable_snr_preserving: false
    lambda_snr_preserving: 1.0
    target_snr: 20.0

  # SSL contrastive losses (active only for SSL/MAE paradigms).
  ssl:
    enable_contrastive: false
    lambda_contrastive: 1.0
    temperature: 0.07

  # PINN PDE-residual losses.
  pinn:
    enable_pde: false
    lambda_pde: 0.1
    enable_unit_norm_coil: false
    lambda_unit_norm_coil: 10.0
    enable_magnitude_tv: false
    lambda_magnitude_tv: 0.001

# ============================================================================
# METRICS CONFIGURATION  (MetricsConfigSchema)
# ============================================================================
  lambda_deep_supervision: 0.0
metrics:
  enable_tracking: true
  compute_psnr: true
  compute_ssim: true
  compute_mse: true
  compute_mae: true
  compute_lpips: false
  compute_fid: false
  compute_robust_mri_psnr: false
  compute_nmse: false
  compute_nrmse: false
  compute_snr: false
  compute_hfen: false
  compute_ms_ssim: false
  compute_advanced_metrics: true
  metric_interval: 1000
  eval_on_epoch: true
  best_metric_name: 'val_loss'
  best_metric_mode: 'min'          # options: 'min', 'max'

# ============================================================================
# VALIDATION CONFIGURATION  (ValidationConfigSchema)
# ============================================================================
validation:
  # Grouped into six sub-blocks (phase 10a). The flat spellings below the blocks
  # are the ones that were NOT grouped, and the comment says why for each.
  schedule:
    interval_steps: 1000      # absorbs the old `eval_interval` AND `frequency_steps`
    on_epoch: true
    interval_epochs: 1

  loader:
    batch_size: null          # absorbs `val_batch_size` AND `validation_batch_size`;
                              # null inherits the training batch size
    chunk_size: 2
    num_batches: null
    num_samples: null
    shuffle: false

  # Named `scoring`, not `metrics`: `validation.metrics` is itself a retired key,
  # and the fold matches on the key name alone -- a block called `metrics` would
  # be folded into itself.
  scoring:
    compute: null             # e.g. ['psnr', 'ssim']; null inherits training.metrics
    primary: 'psnr'
    domain: null              # options: 'image', 'kspace', null (auto-detect)
    # options: 'ifft_magnitude', 'ifft_sense_adjoint', 'magnitude', null.
    # 'ifft_mag_combine' and 'fft' were advertised here and dispatched by
    # nothing (#937); they RAISE now, so they are not listed.
    output_transform: null
    enable_image_metrics: true
    measurement_maps: 'off'   # options: 'off', 'metrics'

  visualization:
    enabled: false
    interval: 1000

  sampling:                   # diffusion paradigms only
    steps: null               # null falls back to training.diffusion.sampling_steps
    enable_multistep_cold: false

  # Gates that can FAIL a run rather than merely measure it.
  gates:
    input_dependence_tol: null    # L4 measurement-independence (DC-blob) gate
    held_out_severity_eval: false # digital-twin / robustness studies
    hallucination_test:
      enabled: false
      # options: 'feature_insertion', 'lesion_swap', 'edge_jitter'
      method: 'feature_insertion'

  # --- ungrouped on purpose: nothing reads these, and a tidy home would imply
  # they work. `enabled` and `split` are issue #673; the rest are carried by
  # KNOWN_UNCONSUMED in tests/unit/config/test_schema_key_consumption.py.
  enabled: true               # INERT: validation runs regardless
  split: 0.2                  # INERT: data.split.validation_fraction is the live one
  validation_metric: 'loss'   # INERT: near-duplicate of scoring.primary, different default

  # The one LIVE ungrouped scalar: a memory-policy knob belonging to no group.
  empty_cache_before_validation: true

# ============================================================================
# CHECKPOINT CONFIGURATION  (CheckpointConfigSchema)
# ============================================================================
checkpoint:
  enabled: true
  save_interval: 1000
  keep_last_n: 5
  load_optimizer_state: true
  load_scheduler_state: true
  format: 'safetensors'            # options: 'safetensors', 'pt', 'pth'
  async_write: false               # true: file writes run on a background thread

# ============================================================================
# LOGGING CONFIGURATION  (LoggingConfigSchema)
# ============================================================================
logging:
  # Grouped into nine sub-blocks (phase 10b, plus `distributed` and `progress`). The flat spellings still load and
  # are folded into place, but they are gone from Python.
  identity:
    # NB: the experiment name MUST live under `logging:`, not at top level --
    # TrainingSettings is `extra="forbid"` and only LoggingConfigSchema has it.
    experiment: 'v1_0_reference_config'
    run: null                        # null derives a run name
    notes: null
    tags: {}

  sinks:                             # where log lines go, and how much of them
    level: 'info'                    # options: 'debug', 'info', 'warning', 'error', 'critical'
    silent: false
    to_console: true
    console_stream: 'split'          # options: 'split' (INFO -> stdout, WARNING+ -> stderr), 'stdout', 'stderr'
    to_file: true
    dir: './logs'

  distributed:                       # what the ranks of a torchrun launch write
    console_ranks: 'rank0'           # options: 'rank0', 'all'
    secondary_level: 'error'         # options: 'debug', 'info', 'warning', 'error', 'critical' (console floor on ranks != 0 when console_ranks is 'rank0')
    file_ranks: 'rank0'              # options: 'rank0', 'all' ('all': <name>.rank<N>.log per rank)

  progress:                          # a bar on a TTY, one tracking line per N iterations in the log
    mode: 'auto'                     # options: 'auto', 'bar', 'lines', 'off'
    log_every_n_iterations: 1500

  intervals:                         # every-N-steps cadences
    log: 10
    save: 100
    validation_images: 1             # every N validations
    anomaly_check: 100
    histogram: 1000                  # weight/grad histograms every N steps.
    # Deliberately far coarser than `log`: add_histogram copies EVERY parameter
    # to host memory, which is a GPU sync per tensor (non-negotiable #9).

  images:
    log_input: false
    log_validation: true
    log_difference: true             # |prediction - target|
    save_validation: true            # to disk, as opposed to the tracker
    max_per_batch: 4

  tracking:
    enabled: true
    service: 'tensorboard'           # options: 'tensorboard', 'none'
    # `wandb` and `mlflow` were advertised here and neither ever existed in
    # code. `service` was a bare string compared against "tensorboard", so
    # declaring either disabled tracking silently. It is a closed enum now.
    enable_tensorboard: true
    tensorboard_dir: null            # relative to the RUN dir; null -> <run_dir>/tensorboard

  # Named `snapshots`, not `debug_snapshots`: that is the retired scalar's own
  # name, and a destination block may not share it -- a migrated arm would be
  # folded into itself.
  snapshots:                         # json + image dumps at start-of-training
    enabled: true
    interval_steps: 0                # 0 = use `log_steps` instead
    max_calls: 8
    save_images: true
    save_json: true
    log_steps: [0, 1, 2, 10]

  report_cases:
    enabled: true
    subdir: 'report_cases'

  # --- ungrouped on purpose: nothing reads these, and a tidy home would imply
  # they work. All seven below are carried by KNOWN_UNCONSUMED in
  # tests/unit/config/test_schema_key_consumption.py.
  #
  # `wandb_project` / `wandb_entity` are NOT here: declaring either now RAISES
  # (#675, 2026-08-12) rather than being accepted-and-ignored, so this
  # template -- what new arms copy from -- must not write them. See
  # logging.py's `_refuse_deferred_wandb` validator.
  log_weights: false                 # INERT
  log_activations: false             # INERT
  log_validation_graphs: true        # INERT
  save_images_per_epoch: 4           # INERT
  progress_bar_enabled: true         # read by infrastructure/logging/progress.py
  progress_bar_on_warning: true      # read by infrastructure/logging/progress.py
  progress_bar_no_progress: false    # read by infrastructure/logging/progress.py

  # LIVE, but both its group-mates above are inert, so there is no group to join.
  log_gradients: false

# ============================================================================
# EARLY STOPPING  (EarlyStoppingConfigSchema)
# ============================================================================
early_stopping:
  enabled: true
  patience: 10
  patience_min_iterations: null
  metric: 'val_loss'
  mode: 'min'                      # options: 'min', 'max'
  min_delta: 1.0e-4
  restore_best_weights: true

# ============================================================================
# EMA (Exponential Moving Average)  (EMAConfigSchema)
# ============================================================================
ema:
  enabled: false
  decay: 0.999
  update_frequency: 1
  enable_adaptive_ema: false
  warmup_steps: 0
  initial_decay: 0.0
  final_decay: 0.999
  stability_threshold: 1.0e-6
  adaptation_rate: 0.01
  enable_momentum_scaling: false
  enable_ema_for_optimizer: false

# ============================================================================
# LOSS LOGGING  (LossLoggingConfigSchema)
# ============================================================================
loss_logging:
  frequency: 1
  output_dir: null

# ============================================================================
# ACCELERATION  (AccelerationConfigSchema) — k-space mask scheduling
# ============================================================================
# Renamed from `acceleration:` in phase 11 -- the old name meant both the MRI
# k-space acceleration factor and compute acceleration. The legacy spelling
# still loads (a ROOT fold moves the whole block).
undersampling:
  base_acceleration: 4.0
  max_acceleration: 8.0
  # options: 'linear', 'polynomial', 'exponential', 'step', 'power_law'
  acceleration_schedule: 'linear'
  schedule_steps: 10000
  schedule_power: 2.0
  # options: the keys of infrastructure/physics/sampling._ACCELERATOR_REGISTRY --
  #   'equispaced', 'uniform_cartesian', 'variable_density', 'variable_density_1d',
  #   'variable_density_2d_gaussian', 'variable_density_cava',
  #   'fractional_variable_density', 'random_cartesian', 'poisson_disk', 'radial',
  #   'spiral', 'golden_angle', 'partial_fourier', 'nested', 'learned_pattern',
  #   'multi_mask', 'linear'.
  # NOT MaskType: that enum drives the separate static-mask path and its members
  #   ('cartesian_lines', 'cartesian_peripheral', 'sle_kappa', ...) are not
  #   accelerators. The two vocabularies overlap but are not the same set.
  acceleration_type: 'variable_density'
  center_fraction: 0.08
  density_power: 2.0
  sigma_scaling: 0.25
  std_scale: 4.0
  pf_fraction: 0.75
  mask_combination_mode: 'rotate'
  undersampling_pattern: 'random'
  enable_dynamic_mask: false
  mask_seed: null
  # Coerce the cascade so M_{t+1} is a subset of M_t at every timestep, which is
  # what cold diffusion's forward process assumes. Off by default: enabling it
  # changes the masks of any family that does not already nest. Enforcement can
  # only REMOVE samples, so a family that re-draws its pattern per timestep
  # collapses and raises rather than degrading silently.
  enforce_nested: false
  # Minimum share of the requested budget an enforced mask may realise before
  # enforce_nested raises. Only read when enforce_nested is true.
  nested_tolerance: 0.5

  # Adaptive (post-hoc PILOT-style adaptive acquisition).
  adaptive:
    enabled: false

# --- remaining fields of this block that have a constrained value set. -----
# Commented because each would otherwise change what the template resolves
# to; uncomment the lines you need. Generated from the schema -- see
# tests/unit/config/test_reference_template_options.py, which fails if any
# list here stops matching its Enum/Literal.
#   schedule_type: null                          # options: null, 'linear', 'polynomial', 'exponential', 'step', 'power_law'

# ============================================================================
# PHYSICS  (PhysicsConfigSchema)
# ============================================================================
physics:
  # Forward model — DC projection / soft DC weighted insertion.
  data_consistency:
    enabled: true
    method: 'projection_2d_consistency'
    weight: 1.0
    noise_type: 'gaussian'
    train_noise_level: 0.01
    eval_noise_level: 0.005
    enable_acs_decoupling: false

  # ESPIRiT / PINN coil sensitivity estimation.
  coil_sensitivity:
    enable_estimation: false
    estimation_type: 'dynamic'     # options: 'dynamic', 'static'
    calibration_region_size: 24
    num_threads: 4
    precomputed_path: null
    precomputed_type: 'pt'

  # k-space sanity rails.
  kspace:
    enable_kspace_recon: false
    enforce_hermitian_symmetry: true
    zero_pad_reconstruction: false
    data_range: 1.0
    max_magnitude: 1.0

  # Sparsity / TV regularisation hooks.
  regularization:
    enable_tv: false
    tv_weight: 0.01
    tv_type: 'isotropic'           # options: 'isotropic', 'anisotropic'
    enable_wavelets: false
    wavelet_weight: 0.01
    wavelet_family: 'db4'          # options: pywt families ('db1'..'db20', 'sym2'..., 'coif1'...)
    wavelet_levels: 3
    enable_sparsity: false
    sparsity_weight: 0.001
    sparsity_type: 'l1'            # options: 'l1', 'l2', 'log'
    physics_penalty_weight: 0.0
    l2_penalty: 0.0

  iterative_refinement:
    enabled: false
    num_steps: 1
    dc_weight: 1.0
    residual_learning: false

  phase_correction:
    enable_phase_estimation: false
    estimation_method: 'voxel_wise'  # options: 'voxel_wise', 'patch', 'mrf_dictionary'
    phase_smoothing: true

  b0_correction:
    enable_b0_correction: false
    num_shim_orders: 2
    estimate_from_data: true

  b0_simulation:
    enabled: false
    max_hz: null
    style: 'smooth'                  # options: 'smooth', 'piecewise', 'spike'
    probability: 0.5

  field_strength: 3.0

  motion_correction:
    enable_motion_correction: false
    # options: 'translational', 'rigid', 'affine', 'elastic'
    motion_type: 'translational'
    reference_frame: 'middle'        # options: 'middle', 'first', 'last'
    method: 'standard'

  compressed_sensing:
    enabled: false
    sampling_pattern: 'cartesian'    # options: 'cartesian', 'radial', 'spiral', 'poisson_disc'
    acceleration_factor: 4.0
    sparsity_transform: 'wavelet'    # options: 'wavelet', 'tv', 'identity'
    reconstruction_algorithm: 'iterative_soft_thresh'  # options: 'iterative_soft_thresh', 'admm', 'pgd'
    num_iterations: 10
    threshold_scaling: 1.0
    convergence_tolerance: 1.0e-5
    step_size: 0.1
    enforce_data_consistency: true
    use_adaptive_threshold: false

  pinn:
    enabled: false
    pde_type: 'wave_equation'        # options: 'wave_equation', 'heat_equation', 'maxwell'
    boundary_condition: 'dirichlet'  # options: 'dirichlet', 'neumann', 'periodic'
    collocation_points: 2048
    lambda_pde: 0.1
    warmup_epochs: 200
    alpha_ema: 0.9
    map_save_interval: 5

  bloch_simulation:
    enabled: false
    target_tr: 3000.0
    target_te: 100.0

  digital_twin:
    enabled: false
    marker_type: 'gaussian'          # options: 'gaussian', 'cross'
    corner_offset: 0.8
    marker_sigma: 0.03
    learnable_markers: false
    motion_type: 'rigid'             # options: 'rigid', 'periodic', 'random_shot', 'elastic'
    motion_composite: []             # options: list of motion_type values, in compose order
    motion_severity: 1.0
    # EVERY enable_* defaults FALSE (changed 2026-08-03): they sit under a parent
    # whose own `enabled` is false, so a true default meant that switching the twin
    # on bought corruption unasked. This block showed the first three as `true`
    # until 2026-08-06; that was stale, not a different default.
    enable_motion: false
    enable_b0: false
    enable_b1: false
    enable_undersampling: false
    # Lines the undersampling mask drops; needs data.acquisition.phase_encode_axis. Unset keeps the rows mask.
    mask_axis: null                              # options: null, 'phase', 'readout'
    ood_acceleration_range: null     # or ascending rates above 1.0, e.g. [16.0, 32.0]: the VF-family validation re-scores each as val_ood_{R}x_<metric> (needs enable_undersampling)
    enable_gibbs: false
    enable_chemical_shift: false
    enable_eddy_current: false
    enable_spike_noise: false
    enable_rf_crosstalk: false
    enable_b0_distortion: false
    enable_gradient_nonlinearity: false
    enable_rf_zipper: false
    enable_magic_angle: false

    # The complex-AWGN stage has NO enable flag — it always runs. Its severity is
    # degradation_ranges['noise'] (see below), so pinning that to [0.0, 0.0] is the
    # only way to silence it.
    snr_min: 10.0                    # amplitude SNR in dB; each forward pass draws
    snr_max: 25.0                    # a target uniformly from [snr_min, snr_max]

    # Which degradations couple to the diffusion corruption factor, and the
    # [vmin, vmax] window each severity is remapped onto. Two banks are accepted:
    # the simulator's 14 NATIVE axes, and the keys of DEGRADATION_REGISTRY
    # (applied as standalone operators after the native pipeline). Five names are in
    # both — b0, chemical_shift, gibbs, gradient_nonlinearity, magic_angle — and are
    # then handled NATIVELY, so the registry operator of the same name does not run.
    #
    # Two rules with teeth:
    #   * a feature ABSENT from a non-empty progressive_degradations is held STATIC
    #     at effective cf 1.0, i.e. full strength, not skipped;
    #   * a DEGENERATE range [t, t] pins that axis at t regardless of the corruption
    #     factor. That is how a fitted DegradationChain replays as ordinary config
    #     (see infrastructure/physics/degradation_chain.py).
    progressive_degradations: ['motion', 'noise', 'b0', 'b1']
    degradation_ranges:
      motion: [0.0, 1.0]
      noise: [0.0, 1.0]
      b0: [0.0, 1.0]
      b1: [0.0, 1.0]
      rf_zipper: [0.0, 1.0]
      gradient_nonlinearity: [0.0, 1.0]

    # SHAPE of the severity ramp over diffusion timesteps — the same vocabulary as
    # undersampling.acceleration_schedule above, because it is the same ramp applied
    # to severity instead of acceleration. Until these existed the remap from the
    # corruption factor onto (vmin, vmax) was linear and there was no way to say
    # otherwise. 'linear' is the identity and reproduces every config written
    # before them.
    #
    # 'step' differs from undersampling's: there it indexes an explicit
    # acceleration_range LIST, and severity has only the (vmin, vmax) pair, so here
    # it is binary at the midpoint — vmin below, vmax above.
    # options: 'linear', 'polynomial', 'power_law', 'exponential', 'step'
    degradation_schedule: 'linear'      # applies to every axis...
    degradation_schedules: {}           # ...unless overridden per axis, e.g.
                                        #   {motion: step, noise: power_law}
                                        # Keys must name a known axis AND appear in
                                        # progressive_degradations: an axis absent
                                        # from a non-empty list is held STATIC at
                                        # full strength, so its ramp never fires.
    degradation_schedule_power: 2.0     # read only by power_law / polynomial

    # Apply the twin as a transversal data-pipeline transform (DigitalTwinDegradation)
    # instead of inside a VF strategy: corrupts the acquisition into `input` and keeps
    # the clean `target`. K-SPACE datasets only — it raises on a subject carrying
    # neither `kspace_raw` nor `kspace`. Leave off for VF arms, which corrupt
    # internally; both routes at once double-corrupts.
    apply_as_transform: false
    transform_degradation_only: true  # skip VF marker embedding on the transform route

    # Scanner profile for the registry operators (new in v1.0; additive, no key moved,
    # so no RENAMES record). Absent (null) = no profile and the twin is unchanged. Present,
    # it builds one ScannerProfile whose B0 is physics.field_strength, and the profile sets
    # the conditioned operators' physical scale (e.g. b0_geometric_distortion's readout
    # dwell from readout_bw_hz_per_px, concomitant_phase from B0). A preset supplies the
    # defaults and any non-null field overrides it; a preset at a B0 other than
    # physics.field_strength raises at load. Without a preset, readout_bw_hz_per_px and
    # sequence are required and the geometry starts as slice_2d with unknown voxel size.
    # The profile also owns the native stages: B0 scales b0 / b0_distortion / b1, the
    # readout dwell and the sequence's shift model (epi, or spin-warp for every other
    # Cartesian sequence; radial/spiral raise) drive b0_distortion, and the fat shift and
    # fat fraction come from B0 and bandwidth. A b0_dwell_time or chemical_shift_pixels
    # that differs from both its default and the profile's value raises. VF arms need
    # sequence: epi (the field score grades the EPI phase-encode shift).
    # A volume mode makes the twin read 5-D input as (B, C, D, PE, RO). multislice_2d runs
    # the native stages per slice and the registry axes on the stack; volume_3d runs the
    # registry axes and the receiver noise only, and raises on any enabled native stage.
    # A geometry knob set in a mode that no operator reads it in raises at load:
    # voxel_mm is read in every mode, slice_thickness_mm and slice_order need
    # multislice_2d, line_order needs volume_3d, and slice_gap_mm is always refused
    # (the stack spacing is voxel_mm[0]).
    # acquisition:
    #   scanner_profile: 'm4raw_0.3T'   # options: null, 'm4raw_0.3T', 'fastmri_3T' (needs field_strength 0.3 / 3.0)
    #   mode: 'multislice_2d'           # options: null, 'slice_2d', 'multislice_2d', 'volume_3d'
    #   voxel_mm: [5.0, 1.0, 1.0]       # (slice/kz, pe, ro) in mm; every mode
    #   slice_thickness_mm: null        # multislice_2d only; needs voxel_mm
    #   slice_gap_mm: null              # refused when set (gap = voxel_mm[0] - slice_thickness_mm)
    #   slice_order: null               # options: null, 'sequential', 'interleaved' (multislice_2d only)
    #   line_order: null                # options: null, 'linear', 'centric', 'kz_inner', 'ky_inner' (volume_3d only)
    #   sequence: 'spin_echo'           # options: null, 'spin_echo', 'tse', 'gre', 'spoiled_gre', 'ir_tse', 'mprage', 'bssfp', 'epi', 'radial', 'spiral'
    #   readout_bw_hz_per_px: 200.0

  # ----------------------------------------------------------------------------
  # v6.1 NEW: physics sub-blocks (default disabled — v6.0 behaviour preserved)
  # ----------------------------------------------------------------------------

  # (v6.1 new) Concomitant-field correction at low B0 (CAUR — idea 1).
  # Maxwell concomitant fields scale as G^2 / (2 * B0); negligible at
  # 1.5/3T, significant at 64 mT.
  concomitant:
    enabled: false
    max_gradient_T_per_m: 0.040
    waveform_uri: null              # null → trapezoid assumed

  # (v6.1 new) Tissue-class T1/T2 priors for Bloch-constrained translation (idea 3).
  relaxation_priors:
    enabled: false
    t1_table_uri: null              # CSV/JSON: (tissue_class, T1_ms) per field strength
    t2_table_uri: null

  # (v6.1 new) Differentiable pulse-sequence co-design (idea 4).
  gradient_waveform_uri: null       # null → use legacy hard-coded waveform

# --- remaining fields of this block that have a constrained value set. -----
# Commented because each would otherwise change what the template resolves
# to; uncomment the lines you need. Generated from the schema -- see
# tests/unit/config/test_reference_template_options.py, which fails if any
# list here stops matching its Enum/Literal.
#   coil_processing:
#     combine:
#       method: 'none'                           # options: 'none', 'rss', 'sense'
#     compression:
#       method: 'none'                           # options: 'none', 'svd', 'gcc'
#     estimation:
#       method: 'power_iter'                     # options: 'none', 'power_iter', 'espirit', 'pinn', 'rss', 'file'
#     output:
#       channels: 'complex'                      # options: 'complex', 'real_interleaved', 'magnitude'
#       domain: 'kspace'                         # options: 'kspace', 'image', 'source'
#   multi_acquisition:
#     forward_psf:
#       source: 'assumed'                        # options: 'assumed', 'measured'
#     subvoxel_registration:
#       shift_source: 'blind'                    # options: 'blind', 'recovered', 'oracle'
#     method: null                               # options: null, 'double_angle', 'afi', 'dual_echo', 'bloch_siegert', 'mrf', 'lowrank_temporal', 'subvoxel_sr', 'bssfp_banding'

# ============================================================================
# (v6.1 new) ACQUISITION  (AcquisitionConfigSchema)
# ============================================================================
acquisition:
  codesign:
    enabled: false
  active:
    enabled: false

# ============================================================================
# (v6.1 new) CERTIFICATION  (CertificationConfigSchema)
# ============================================================================
# Regulatory / certification side-channels. R1 CDFC (conformal),
# R2 CHD (covariate-shift), R4 PRC (pathology recall), R5 PAC-Bayes,
# V.3 validation badge. All default disabled.
certification:
  conformal:
    enabled: false
  chd:
    enabled: false
  pathology_recall:
    enabled: false
  pac_bayes:
    enabled: false
  badge:
    enabled: false

# --- remaining fields of this block that have a constrained value set. -----
# Commented because each would otherwise change what the template resolves
# to; uncomment the lines you need. Generated from the schema -- see
# tests/unit/config/test_reference_template_options.py, which fails if any
# list here stops matching its Enum/Literal.
#   dice_risk:
#     segmenter_backend: 'label_dice'            # options: 'label_dice', 'synthseg'
#     independence_unit: 'subject'              # options: 'subject', 'sample'

# ============================================================================
# (v6.1 new) AUDIT  (AuditConfigSchema) — Tier-3 defensibility checks
# ============================================================================
# Currently exposes audit.ksd (kernelised Stein discrepancy). Other
# Tier-3 audits land here as the audit_plan_novel.md roadmap progresses.
audit:
  ksd: null                         # set to {enabled: true, ...} to activate

# ============================================================================
# (v6.1 new) MRF  (MRFConfigSchema) — MR-fingerprinting metadata
# ============================================================================
mrf:
  spiral_rotation_schedule: null    # options: null, 'golden_angle', 'linear', 'random'
  conformal_kspace_map: null
  n_timepoints: null
  sar_max_w_per_kg: null
  gradient_slew_rate_t_per_m_per_s: null
  phantom_calibration_path: null
  calibration_dataset: null

# ============================================================================
# PARALLEL  (ParallelismConfigSchema) — DDP / FSDP / PEFT
# ============================================================================
parallel:
  # ``strategy`` is the ONE switch. 'ddp' / 'fsdp' / 'deepspeed' need a process
  # group — launch with:
  #   torchrun --nproc_per_node=N -m spectramr.cli train-distributed --config <this>
  # 'dp' is single-process/N-GPU and needs no launcher.
  #
  # A sub-block flag must AGREE with strategy: 'fsdp' requires fsdp.enabled: true
  # and 'deepspeed' requires deepspeed.enabled: true. Declaring only one half
  # raises at load time. (These used to be independent switches, so
  # strategy: 'fsdp' raised deep inside the build while fsdp.enabled alone
  # sharded silently.)
  strategy: 'none'                  # options: 'none', 'dp', 'ddp', 'fsdp', 'deepspeed'
  num_devices: 1
  num_nodes: 1
  # THIS is the backend SSOT. `train-distributed --backend` overrides it only
  # when explicitly passed.
  backend: 'nccl'                   # options: 'nccl', 'gloo', 'mpi'
  find_unused_parameters: false
  gradient_as_bucket_view: false
  static_graph: false
  sync_batch_norm: false            # needs a process group; rejected for 'dp'

  fsdp:
    enabled: false                  # must equal (strategy == 'fsdp')
    sharding_strategy: 'full_shard' # options: 'full_shard', 'shard_grad_op', 'no_shard', 'hybrid_shard'
    auto_wrap_policy: 'size_based'  # options: 'size_based', 'transformer_block', 'none'
    # REQUIRED when auto_wrap_policy is 'transformer_block'. An empty list
    # matches no module, which is what made that policy wrap nothing while
    # logging that it had sharded.
    transformer_layer_cls: []
    min_num_params: 1000000         # size_based policy only
    cpu_offload: false
    mixed_precision: 'bf16'         # options: 'bf16', 'fp16', null
    reduce_dtype: 'float32'         # options: 'float32', 'match_param'

  # DeepSpeed ZeRO. This block is the SSOT; the ds_config dict is DERIVED from it
  # by build_deepspeed_config and written beside the run's provenance. There is
  # deliberately no `config_path`: a hand-edited ds_config.json has no committed
  # generator, and a divergence from this YAML would be silent.
  #
  # Batch size, gradient accumulation, gradient clipping and fp16/bf16 are NOT
  # declarable here — they come from data.batch_size and optimization.*.
  deepspeed:
    enabled: false                  # must equal (strategy == 'deepspeed')
    zero_stage: 0                   # options: 0, 1, 2, 3
    offload_optimizer: 'none'       # options: 'none', 'cpu', 'nvme'
    offload_param: 'none'           # options: 'none', 'cpu', 'nvme'
    nvme_path: null                 # required when either offload target is 'nvme'
    contiguous_gradients: true
    overlap_comm: true
    reduce_bucket_size: 500000000
    allgather_bucket_size: 500000000
    round_robin_gradients: false
    stage3_gather_16bit_weights_on_model_save: true
    # OFF by default: engine.step() issues collectives, so a GAN whose
    # discriminator steps every k iterations DEADLOCKS rather than erroring.
    allow_multi_engine: false
    steps_per_print: 1000

  # --- remaining fields of this block that have a constrained value set. -----
  # Commented because each would otherwise change what the template resolves
  # to; uncomment the lines you need. Generated from the schema -- see
  # tests/unit/config/test_reference_template_options.py, which fails if any
  # list here stops matching its Enum/Literal.
  #   zenflow:
  #     select_interval: 'auto'                    # options: 'auto'
  #     select_strategy: 'auto'                    # options: 'auto', 'step', 'epoch'
  #     update_interval: 'auto'                    # options: 'auto'

  peft:
    enabled: false
    method: 'lora'                  # options: 'lora', 'adapter', 'prefix_tuning', 'bitfit'
    rank: 8
    alpha: 16.0
    dropout: 0.0
    target_modules: []
    bias_mode: 'none'               # options: 'none', 'all', 'lora_only'

# ============================================================================
# OPTIONAL TOP-LEVEL BLOCKS — left commented; uncomment as needed.
# ============================================================================
#
# reporting:                        # ReportingSettings — end-of-training report
#   enabled: false
#   task: 'default'                            # options: 'default', 'reconstruction', 'synthesis',
#                                                         'super_resolution', 'gan', 'diffusion', 'vae', 'calibration'
#   case_selection: 'best_median_worst'        # options: 'best_median_worst', 'random', 'first'
#   style: 'nature'                            # options: 'nature', 'ieee', 'poster', 'slides'
#   out_subdir: 'report'
#
# adapters:                         # AdaptersConfigSchema — declarative adapter chains
#   pre_model: []
#   post_model: []
#   pre_loss_target: []
#   pre_metric: []
#
# backend_acceleration:          # SPECTRA / WCSR co-simulation backend
#   backend: 'spectra'
#   cosim_bridge_addr: null
#   enable_nmae: true
#   gridding_kernel_width: 4
#   lanes: 4
#   mesh_cols: 4
#   mesh_rows: 4
#   oversampling: 2.0
#   pe_mode_policy: null                       # options: 'mixed', 'fp32', 'bf16', 'fp8'
#   per_channel_scaling: true
#   runtime: null                              # options: 'cosim', 'rocc'
#
# diffusion: {}                # free-form dict[str, Any]; distinct from the `training.diffusion` block
#
# loss_schedule:                 # declarative loss-weight schedule; `rules:` is a LIST
#   checkpoint_min_interval: null
#   checkpoint_on_change: false
#   enabled: false
#   rules:
#     - name: '...'
#       target: '...'
#       action:
#         factor: null
#         max_weight: null
#         min_weight: null
#         over: null
#         shape: null                          # options: 'linear', 'sigmoid'
#         to: null
#         type: 'set_weight'                   # options: 'set_weight', 'scale', 'ramp', 'enable', 'disable'
#       monitor_after:
#         expect: null                         # options: 'improve', 'not_worse'
#         metric: '...'
#         min_delta: 0.0
#         mode: null                           # options: 'min', 'max'
#         on_failure: null                     # options: 'rollback', 'hold', 'continue'
#         window: 3
#       trigger:
#         at: null
#         cooldown: null
#         every: null
#         loss_key: null
#         metric: null
#         min_delta: null
#         mode: null                           # options: null, 'min', 'max'
#         patience: null
#         type: 'iteration'                    # options: 'iteration', 'epoch', 'metric_plateau', 'loss_plateau',
#                                                         'metric_threshold'
#         value: null
#
# plugins:                       # out-of-tree component registration
#   enabled: false
#   paths: '...'
#
# privacy:                       # DP-SGD accounting
#   dataset_size: null
#   max_grad_norm: 1.0
#   noise_multiplier: 1.1
#   target_delta: 1e-05
#
# metadata:                         # ExperimentMetadataSchema; unknown keys are kept as free-form bookkeeping
#   name: 'my_arm'
#   hypothesis: '...'
#   baseline: 'control_arm'         # metadata.name of the sibling this arm is a variant of
#   primary_metric: 'psnr'
#   # options: null, 'comparable', 'floor', 'ceiling'
#   expected_outcome: null          # how the result reads against the baseline; floor/ceiling need one
#   # options: null, 'ready', 'needs_implementation', 'inert', 'blocked', 'needs_data',
#            'method_demonstration', 'wiring_demonstrator', 'baseline_control'
#   status: 'ready'                 # train refuses needs_implementation/inert/blocked unless --allow-status names it
#   status_reason: null

workflow:
  # options: 'mri_structural', 'mri_quantitative', 'mri_fingerprinting',
  #          'mri_functional', 'mri_diffusion_weighted', 'mri_perfusion',
  #          'mri_spectroscopy', 'mri_flow', 'mri_dynamic', 'nmr_spectroscopy', 'ct',
  #          'xray', 'ultrasound', 'optical'
  regime: mri_structural
  # options: null, 'reconstruction', 'denoising', 'super_resolution', 'synthesis',
  #          'field_translation', 'contrast_translation', 'parameter_mapping',
  #          'motion_correction', 'acquisition_design'
  task: reconstruction
  # What this arm CONSUMES, not what it emits (== ModelCapabilities.input_domain).
  # `image`, not `kspace`, even though data.dataset_type is `kspace`: standard_unet
  # declares input_domain=("image",), so the arm bridges. The distinction is the
  # whole point of the field -- reading it as *emits* would reject every
  # parameter-mapping arm, which emits off-regime by construction.
  # options: null, 'image', 'kspace', 'complex_image', 'latent', 'pde_grid', 'mesh',
  #          'spectrum'
  signal_domain: image
  spatial_rank: 2
run:
  seed: 42
  # ----------------------------------------------------------------------------
  # Top-level scalars (TrainingSettings)
  # ----------------------------------------------------------------------------
  device: 'cuda'           # options: 'cuda', 'cpu', 'mps', 'auto'
