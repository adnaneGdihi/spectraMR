config_version: '6.0'

experiment:
  name: baseline_gan_preset
  description: Standard GAN baseline for MRI reconstruction
  tags: [baseline, gan]

data:
  dataset_type: fastmri_knee
  batch_size: 32
  num_workers: 4
  pin_memory: true
  augment: true
  center_fraction: 0.08
  acceleration: 4

model:
  model_type: standard_unet
  in_channels: 2
  out_channels: 2
  num_residual_blocks: 2

optimization:
  epochs: 100
  optimizer:
    type: adam
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8


training:
  training_mode: gan
  device: cuda
  enable_checkpointing: true
  checkpoint_interval: 10
  validate_interval: 5

objectives:
  gan:
    lambda_adversarial: 0.1
    lambda_l1: 1.0
    enable_gradient_penalty: false
    discriminator_type: patch_gan
    discriminator_layers: 3

validation:
  enabled: true
  validation_interval: 5
  metrics: [psnr, ssim, lpips]

checkpoint:
  save_best: true
  monitor_metric: validation_ssim
  mode: max
  save_frequency: 10

acceleration:
  use_amp: true
  num_gpus: 1
  strategy: none

workflow:
  name: mri_structural
  task: reconstruction
